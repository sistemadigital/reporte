<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Orden de Subrogancia | Defensoría Civil y Comercial Nº 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6fc;
        }
        .mode-item {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .mode-item:hover {
            background-color: #eef2ff;
            border-left-color: #4f46e5;
            transform: translateX(2px);
        }
        .mode-item.active {
            background-color: #e0e7ff;
            border-left-color: #1e3a8a;
            font-weight: 700;
            color: #1e1b4b;
        }
        .scroll-panel {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .scroll-panel::-webkit-scrollbar {
            width: 5px;
        }
        .scroll-panel::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .scroll-panel::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .detail-content p, .detail-content li {
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .detail-content ul {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
            list-style-type: disc;
        }
        .detail-content li {
            margin-bottom: 0.5rem;
        }
        .detail-content h4 {
            font-weight: 700;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .badge-normativa {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 1.5rem;
            border-left: 3px solid #f59e0b;
        }
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-content {
                display: block;
                margin: 0 auto;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

    <header class="bg-indigo-950 text-white border-b-4 border-amber-500 shadow-md sticky top-0 z-10">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="scale" class="w-7 h-7 text-amber-400"></i>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Orden de Subrogancia</h1>
                    <p class="text-xs text-indigo-200 mt-0.5">Defensoría Oficial Civil y Comercial Nº 6 · Primera Circunscripción Judicial</p>
                </div>
            </div>
            <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="filtroBusqueda" placeholder="Buscar por modo (subrogación, turno...)" 
                       class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white text-slate-800 shadow-sm">
            </div>
        </div>
    </header>

    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-6">
            
            <!-- PANEL LATERAL: MODOS DE CONSULTA -->
            <aside class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-indigo-50 to-slate-50 px-5 py-4 border-b border-indigo-100">
                    <h2 class="text-indigo-800 font-black text-lg flex items-center gap-2">
                        <i data-lucide="git-branch" class="w-5 h-5"></i> Subrogación y turnos
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">Defensoría Civil y Comercial Nº 6 (Posadas)</p>
                </div>
                <div class="h-[calc(100vh-13rem)] overflow-y-auto scroll-panel p-2">
                    <div id="modesList" class="space-y-1.5"></div>
                </div>
                <div class="bg-indigo-50/30 px-4 py-2 text-[11px] text-slate-400 border-t border-indigo-100 flex justify-between">
                    <span><i data-lucide="file-text" class="w-3 h-3 inline mr-1"></i> Ley IV-N°15 · Ac. STJ</span>
                    <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i> Actualizado 2025</span>
                </div>
            </aside>
            
            <!-- PANEL CENTRAL: DETALLE NORMATIVO Y EXPLICACIÓN -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-slate-50 to-indigo-50/30 px-6 py-5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-indigo-100 rounded-xl text-indigo-700">
                                <i data-lucide="gavel" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 id="tituloDetalle" class="text-2xl font-black text-slate-800 tracking-tight">Defensoría N° 6</h2>
                                <p id="subtituloDetalle" class="text-sm text-indigo-600 font-mono">RPJ · Arts. 121 bis, 121 quinquies y 122</p>
                            </div>
                        </div>
                        <button id="btnImprimir" class="flex items-center gap-2 bg-white hover:bg-indigo-50 text-slate-700 font-medium py-2 px-4 rounded-xl border border-slate-200 shadow-sm transition-all duration-200">
                            <i data-lucide="printer" class="w-4 h-4"></i>
                            <span class="text-sm">Imprimir</span>
                        </button>
                    </div>
                </div>
                <div id="contenedorCentral" class="p-6 md:p-8 detail-content"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DEFINICIÓN DE MODOS (CENTRADOS EN DEFENSORÍA Nº 6) ====================
        const modosLista = [
            "Subrogación natural (pasiva) · ¿Quiénes subrogan a la N° 6?",
            "Subrogación activa · ¿A quién reemplaza la N° 6?",
            "Orden de turno mensual · Defensorías N° 3 a 9",
            "Base legal · Reglamento y leyes aplicables",
            "Procedimiento de subrogación · Art. 121 quinquies RPJ"
        ];

        let currentMode = null;
        let currentFilter = "";

        // ==================== CONTENIDO DETALLADO ====================

        // 1) Subrogación pasiva: quienes subrogan a la Defensoría N° 6
        function contenidoSubrogacionPasiva() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-amber-50 to-rose-50 rounded-xl p-5 border-l-8 border-indigo-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-indigo-700"><i data-lucide="arrow-left" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Subrogación pasiva: órden de prelación para reemplazar a la Defensoría Oficial Civil y Comercial N° 6</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-3">Según el <strong>Art. 121 quinquies del Reglamento para el Poder Judicial (RPJ)</strong>, dentro de la Primera Circunscripción Judicial (Posadas), las Defensorías en lo Civil y Comercial, Laboral y de Familia se subrogan entre sí en el siguiente orden <strong>cerrado y sucesivo</strong>:</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <i data-lucide="list-ordered" class="w-5 h-5 text-indigo-600 mb-2"></i>
                                <h4 class="font-black text-slate-800">Secuencia general</h4>
                                <ul class="text-sm mt-2 space-y-1 list-none pl-0">
                                    <li><span class="font-mono font-bold">N° 3</span> → N° 4</li>
                                    <li><span class="font-mono font-bold">N° 4</span> → N° 5</li>
                                    <li><span class="font-mono font-bold">N° 5</span> → <span class="bg-indigo-100 px-1 rounded">N° 6</span></li>
                                    <li><span class="font-mono font-bold">N° 6</span> → N° 7</li>
                                    <li><span class="font-mono font-bold">N° 7</span> → N° 8</li>
                                    <li><span class="font-mono font-bold">N° 8</span> → N° 9</li>
                                    <li><span class="font-mono font-bold">N° 9</span> → N° 3</li>
                                </ul>
                            </div>
                            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-200">
                                <i data-lucide="users" class="w-5 h-5 text-indigo-700 mb-2"></i>
                                <h4 class="font-black text-slate-800">¿Quién subroga a la Defensoría N° 6?</h4>
                                <p class="text-slate-800 text-base font-semibold mt-2">La Defensoría <span class="bg-white px-2 py-0.5 rounded shadow-sm text-indigo-800">N° 5</span></p>
                                <p class="text-slate-600 text-sm mt-2">En caso de licencia, vacancia, recusación o impedimento, asume automáticamente la <strong>Defensoría N° 5</strong>. Si ésta también estuviera impedida, el orden continúa con el siguiente eslabón de la cadena circular.</p>
                                <div class="mt-3 p-2 bg-white rounded text-xs text-slate-500">
                                    <i data-lucide="info" class="w-3 h-3 inline mr-1"></i> La subrogación es recíproca y se aplica tanto para suplencias transitorias como definitivas.
                                </div>
                            </div>
                        </div>
                        <h4><i data-lucide="chevrons-right" class="w-4 h-4"></i> Subrogación secundaria (si falla la cadena interna)</h4>
                        <p class="text-slate-700">Agotada la lista de defensorías civiles y comerciales (N°3 a N°9), el Art. 121 quinquies establece el siguiente orden supletorio:</p>
                        <ol class="list-decimal pl-5 mt-2 space-y-1">
                            <li><strong>Defensoría del Trabajador</strong> de Posadas.</li>
                            <li><strong>Defensoría en lo Correccional y de Menores</strong> de Posadas que no se halle en turno.</li>
                            <li><strong>Defensoría de Instrucción</strong> de Posadas (comenzando por la de más baja numeración que no esté en turno).</li>
                            <li><strong>Defensoría Civil, Comercial, Laboral, de Familia y Violencia Familiar de Apóstoles</strong>.</li>
                            <li><strong>Defensoría de Instrucción de Apóstoles</strong>.</li>
                        </ol>
                        <div class="mt-4 p-3 bg-amber-50 rounded-lg text-sm border-l-3 border-amber-400">
                            <i data-lucide="alert-circle" class="w-4 h-4 text-amber-600 inline mr-2"></i>
                            <span class="font-semibold">Importante:</span> La subrogación opera de pleno derecho, sin necesidad de resolución expresa en cada expediente (art. 130 RPJ).
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Art. 121 quinquies RPJ · Ley IV-N°15 · Acordadas complementarias</div>
                </div>
            `;
        }

        // 2) Subrogación activa: a quién reemplaza la Defensoría N° 6
        function contenidoSubrogacionActiva() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl p-5 border-l-8 border-emerald-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-emerald-700"><i data-lucide="arrow-right" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Subrogación activa: Defensoría N° 6 como subrogante</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">Cuando la <strong>Defensoría Oficial Civil y Comercial N° 7</strong> (o las siguientes) se encontrare con impedimento, la Defensoría N° 6 debe asumir su reemplazo según el orden rotativo establecido.</p>
                        <div class="relative pl-6 border-l-4 border-indigo-300 my-5">
                            <h4 class="text-indigo-800 font-black text-md flex items-center gap-2"><i data-lucide="target" class="w-4 h-4"></i> Destino principal de la subrogación</h4>
                            <p class="text-slate-800 text-lg font-bold mt-1">Defensoría N° 7 → en caso de ausencia, licencia o vacancia, la N° 6 la subroga.</p>
                            <p class="text-slate-600 text-sm mt-1">(Según la secuencia: N° 6 → N° 7)</p>
                        </div>
                        <p class="text-slate-700">Si la Defensoría N° 7 no pudiera actuar, la N° 6 también podrá ser llamada a subrogar a la N° 8 cuando el orden escalonado lo requiera (por ejemplo, si la N° 7 está subrogando a otra y no puede atender su propia suplencia).</p>
                        <div class="mt-5 bg-slate-50 p-4 rounded-xl">
                            <i data-lucide="git-graph" class="w-5 h-5 text-indigo-600 mb-2"></i>
                            <h4 class="font-semibold">Cadena completa (circular)</h4>
                            <div class="flex flex-wrap gap-2 mt-2 text-sm font-mono">
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 3</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 4</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 5</span> → 
                                <span class="bg-indigo-200 font-bold px-3 py-1 rounded-full shadow-sm">N° 6</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 7</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 8</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 9</span> → 
                                <span class="bg-white px-3 py-1 rounded-full shadow-sm">N° 3</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-3">La subrogación activa debe respetar este orden, salvo que las necesidades del servicio determinen una sustitución directa por la Defensoría del Trabajador (art. 121 quinquies, punto 2).</p>
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="repeat" class="w-3 h-3 inline mr-1"></i> Subrogación recíproca · Capítulo VIII RPJ</div>
                </div>
            `;
        }

        // 3) Orden de turno mensual (Defensorías N° 3 a N° 9)
        function contenidoOrdenTurno() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-sky-50 to-blue-50 rounded-xl p-5 border-l-8 border-sky-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-sky-700"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Turnos mensuales · Defensorías de Primera Instancia Civil, Comercial, Laboral y de Familia (Posadas)</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-3">El <strong>artículo 122 (inciso 2, apartado b)</strong> del Reglamento para el Poder Judicial dispone que las Defensorías Oficiales de Primera Instancia números <strong>3, 4, 5, 6, 7, 8 y 9</strong> actuarán por <strong>turnos mensuales</strong>, comenzando el año calendario con la <strong>Defensoría N° 3</strong>.</p>
                        <div class="overflow-x-auto my-5">
                            <table class="min-w-full bg-white border border-slate-200 rounded-xl shadow-sm text-sm">
                                <thead class="bg-indigo-50">
                                    <tr><th class="px-4 py-2 text-left font-bold">Mes</th><th class="px-4 py-2 text-left font-bold">Defensoría en turno</th></tr>
                                </thead>
                                <tbody class="divide-y">
                                    <tr><td class="px-4 py-2 font-medium">Enero</td><td class="px-4 py-2">N° 3</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Febrero</td><td class="px-4 py-2">N° 4</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Marzo</td><td class="px-4 py-2">N° 5</td></tr>
                                    <tr class="bg-indigo-50/40"><td class="px-4 py-2 font-bold">Abril</td><td class="px-4 py-2 font-bold text-indigo-800">N° 6</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Mayo</td><td class="px-4 py-2">N° 7</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Junio</td><td class="px-4 py-2">N° 8</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Julio</td><td class="px-4 py-2">N° 9</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Agosto</td><td class="px-4 py-2">N° 3</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Septiembre</td><td class="px-4 py-2">N° 4</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Octubre</td><td class="px-4 py-2">N° 5</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Noviembre</td><td class="px-4 py-2 font-bold text-indigo-800">N° 6</td></tr>
                                    <tr><td class="px-4 py-2 font-medium">Diciembre</td><td class="px-4 py-2">N° 7</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-indigo-50 rounded-lg border-l-4 border-indigo-500 text-sm">
                            <i data-lucide="info" class="w-4 h-4 inline text-indigo-700 mr-2"></i>
                            <span class="font-semibold">Turno de la Defensoría N° 6:</span> le corresponde el mes de <strong>abril y noviembre</strong> (ciclo cada 6/7 meses según la cantidad de defensorías). El sistema es rotativo continuo, sin solución de continuidad.
                        </div>
                        <p class="text-slate-600 text-sm mt-4">Las causas se asignan según la fecha de entrada y la competencia territorial, respetando el fuero civil y comercial. Fuera del mes de turno, la defensoría atiende únicamente los casos que ya tiene en trámite o aquellos que requieren intervención urgente (art. 123 RPJ).</p>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="calendar-clock" class="w-3 h-3 inline mr-1"></i> Art. 122 RPJ · Acordada STJ · Turnos materia civil y comercial</div>
                </div>
            `;
        }

        // 4) Base legal y referencias normativas completas
        function contenidoBaseLegal() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-50 to-violet-50 rounded-xl p-5 border-l-8 border-violet-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-violet-700"><i data-lucide="book-open" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Fundamento normativo · Subrogación y turnos de las defensorías oficiales</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h3 class="text-indigo-800 font-black flex items-center gap-2"><i data-lucide="file-text" class="w-5 h-5"></i> Reglamento para el Poder Judicial (RPJ) – Año 2025</h3>
                        <ul class="mt-3 space-y-2">
                            <li><span class="badge-normativa">Art. 121 bis</span> – Defensorías de Primera Instancia: creación, competencia y numeración de las defensorías civiles y comerciales N° 3, 4, 5, 6, 7, 8 y 9 con asiento en Posadas.</li>
                            <li><span class="badge-normativa">Art. 121 quinquies</span> – Subrogación entre Defensorías Oficiales (Primera Circunscripción). Establece la secuencia circular N°3→4→5→6→7→8→9→3 y el orden supletorio ante agotamiento (Defensoría del Trabajador, Correccional, Instrucción, etc.).</li>
                            <li><span class="badge-normativa">Art. 122</span> – Turnos del Ministerio Público. Determina que las defensorías N° 3 a N° 9 actúan por turnos mensuales, comenzando por la N° 3 en enero.</li>
                            <li><span class="badge-normativa">Art. 130</span> – Subrogación de secretarios y extensión analógica a funcionarios: la sustitución opera sin necesidad de resolución expresa en cada expediente.</li>
                        </ul>
                        <h4 class="mt-5"><i data-lucide="building-2" class="w-4 h-4"></i> Leyes orgánicas y complementarias</h4>
                        <ul>
                            <li>Ley IV – Nº 15 (<strong>Ley Orgánica del Poder Judicial</strong> de Misiones): arts. 114 a 118 sobre deberes y competencias de los defensores oficiales.</li>
                            <li>Ley XII – Nº 27 (Código Procesal Civil y Comercial): arts. 329 y 626 sobre intervención obligatoria del defensor.</li>
                            <li>Acordadas del Superior Tribunal de Justicia: Ac. 81/22 (actualización de subrogaciones), Ac. 18/11, 19/11, 158/15 (turnos y competencia territorial).</li>
                        </ul>
                        <div class="mt-5 bg-violet-50 p-3 rounded-lg text-sm">
                            <i data-lucide="link" class="w-4 h-4 inline mr-2 text-violet-700"></i> Documento: RPJ 2025, Capítulo VII (Ministerios Públicos) y Capítulo VIII (Secretarías y subrogación).
                        </div>
                    </div>
                </div>
            `;
        }

        // 5) Procedimiento de subrogación (pasos prácticos)
        function contenidoProcedimientoSubrogacion() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-xl p-5 border-l-8 border-indigo-800 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm"><i data-lucide="clipboard-list" class="w-5 h-5 text-indigo-700"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Procedimiento administrativo y judicial para la subrogación</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h4><i data-lucide="corner-down-right" class="w-4 h-4"></i> ¿Cómo opera la subrogación en la práctica?</h4>
                        <ul class="list-decimal pl-5">
                            <li><strong>Declaración de impedimento</strong>: licencia, vacancia, recusación o excusación del titular de la Defensoría N° 6.</li>
                            <li><strong>Subrogación automática</strong>: asume la Defensoría N° 5 (según cadena del art. 121 quinquies). No se requiere auto expreso, basta con la constancia en el expediente o la comunicación administrativa.</li>
                            <li><strong>Comunicación al Superior Tribunal</strong>: el Jefe de la dependencia o el Defensor subrogante debe informar a la Secretaría Administrativa para el registro en el legajo y efectos de haberes (en caso de licencia prolongada).</li>
                            <li><strong>Si ambos titulares (N°6 y N°5) están impedidos</strong>: se aplica el orden supletorio (Defensoría del Trabajador → Correccional → Instrucción → Apóstoles).</li>
                            <li><strong>Fin de la subrogación</strong>: cesa automáticamente cuando el titular original se reincorpora o desaparece la causal (art. 136 para Jueces de Paz, aplicable por analogía).</li>
                        </ul>
                        <div class="mt-5 p-4 bg-indigo-50 rounded-lg">
                            <i data-lucide="users" class="w-5 h-5 text-indigo-700 mb-2"></i>
                            <h4 class="font-bold text-indigo-900">Turno y subrogación concurrente</h4>
                            <p class="text-sm">Si la Defensoría N° 6 está de turno (abril/noviembre) y su titular se ausenta, la subrogación recae en la Defensoría N° 5, la cual asume tanto las causas nuevas del turno como las que ya tramitaba la N° 6. El orden de prioridad es: <strong>primero la subrogación interna</strong> (N° 5), recién luego se recurre a las defensorías supletorias.</p>
                        </div>
                        <div class="mt-3 flex gap-2 text-xs text-slate-500">
                            <span class="badge-normativa">Ac. 76/13</span>
                            <span class="badge-normativa">Art. 130 RPJ</span>
                            <span class="badge-normativa">Art. 121 quinquies</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // PLACEHOLDER (por si no encuentra modo)
        function contenidoPlaceholder() {
            return `
                <div class="flex flex-col items-center justify-center text-center py-12">
                    <i data-lucide="file-question" class="w-20 h-20 text-slate-300 mb-4"></i>
                    <p class="text-slate-500 max-w-md">Seleccione un modo del panel izquierdo para visualizar el detalle de la subrogación, turnos o normativa de la Defensoría Civil y Comercial N° 6.</p>
                    <div class="mt-4 text-sm text-indigo-600">📌 Basado en RPJ 2025 – Capítulos VI y VII</div>
                </div>
            `;
        }

        // ========== ACTUALIZAR VISTA CENTRAL SEGÚN MODO ==========
        function actualizarContenidoCentral(modo) {
            const contenedor = document.getElementById('contenedorCentral');
            const tituloElem = document.getElementById('tituloDetalle');
            const subtituloElem = document.getElementById('subtituloDetalle');
            if (!contenedor) return;

            if (modo === "Subrogación natural (pasiva) · ¿Quiénes subrogan a la N° 6?") {
                tituloElem.innerText = "Subrogación pasiva · Quién reemplaza a la Defensoría N° 6";
                subtituloElem.innerText = "Art. 121 quinquies RPJ · Cadena de prelación";
                contenedor.innerHTML = contenidoSubrogacionPasiva();
            } 
            else if (modo === "Subrogación activa · ¿A quién reemplaza la N° 6?") {
                tituloElem.innerText = "Subrogación activa · Defensoría N° 6 como subrogante";
                subtituloElem.innerText = "Reemplazo a la N° 7 y orden circular";
                contenedor.innerHTML = contenidoSubrogacionActiva();
            }
            else if (modo === "Orden de turno mensual · Defensorías N° 3 a 9") {
                tituloElem.innerText = "Orden de turno mensual";
                subtituloElem.innerText = "Art. 122 RPJ · Turnos rotativos";
                contenedor.innerHTML = contenidoOrdenTurno();
            }
            else if (modo === "Base legal · Reglamento y leyes aplicables") {
                tituloElem.innerText = "Base legal y normas complementarias";
                subtituloElem.innerText = "Ley IV-N°15 · Acordadas STJ · RPJ";
                contenedor.innerHTML = contenidoBaseLegal();
            }
            else if (modo === "Procedimiento de subrogación · Art. 121 quinquies RPJ") {
                tituloElem.innerText = "Procedimiento de subrogación";
                subtituloElem.innerText = "Pasos administrativos y judiciales";
                contenedor.innerHTML = contenidoProcedimientoSubrogacion();
            }
            else {
                tituloElem.innerText = "Defensoría Civil y Comercial Nº 6";
                subtituloElem.innerText = "Seleccione un apartado para ver los detalles";
                contenedor.innerHTML = contenidoPlaceholder();
            }

            if (window.lucide) lucide.createIcons();
        }

        // ========== RENDER LISTA LATERAL + FILTRO ==========
        function renderModesList(filterText = "") {
            const container = document.getElementById('modesList');
            if (!container) return;
            const lowerFilter = filterText.toLowerCase();
            const filteredModes = modosLista.filter(m => m.toLowerCase().includes(lowerFilter));
            if (filteredModes.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-slate-400 text-sm">🔍 Ningún concepto coincide con "${filterText}"</div>`;
                return;
            }
            let html = '';
            filteredModes.forEach(mode => {
                const isActive = (mode === currentMode);
                const activeClass = isActive ? 'active' : '';
                html += `<div class="mode-item ${activeClass} p-3 rounded-xl cursor-pointer transition-all flex items-center gap-2" data-modo="${mode.replace(/"/g, '&quot;')}">
                            <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 text-xs font-black">${isActive ? '✓' : '•'}</div>
                            <span class="text-sm font-medium text-slate-700">${mode}</span>
                         </div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.mode-item').forEach(el => {
                el.addEventListener('click', () => {
                    const modo = el.getAttribute('data-modo');
                    if (modo) setCurrentMode(modo);
                });
            });
            if (window.lucide) lucide.createIcons();
        }

        function setCurrentMode(modo) {
            currentMode = modo;
            renderModesList(currentFilter);
            actualizarContenidoCentral(modo);
        }

        function setupFilter() {
            const filterInput = document.getElementById('filtroBusqueda');
            if (!filterInput) return;
            filterInput.addEventListener('input', (e) => {
                currentFilter = e.target.value;
                renderModesList(currentFilter);
                if (currentMode && !currentMode.toLowerCase().includes(currentFilter.toLowerCase())) {
                    currentMode = null;
                    renderModesList(currentFilter);
                    actualizarContenidoCentral(null);
                }
            });
        }

        // Impresión del detalle actual
        function imprimirDetalle() {
            const titulo = document.getElementById('tituloDetalle')?.innerText || 'Orden de Subrogancia';
            const subtitulo = document.getElementById('subtituloDetalle')?.innerText || '';
            const contenido = document.getElementById('contenedorCentral')?.cloneNode(true);
            if (!contenido) return;
            const printWindow = window.open('', '_blank');
            if (!printWindow) { alert('Permita ventanas emergentes para imprimir.'); return; }
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head><meta charset="UTF-8"><title>${titulo} - Defensoría N°6</title>
                <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
                <style>body{font-family:'Inter',sans-serif;margin:2rem;background:white;color:#0f172a;}
                .print-container{max-width:900px;margin:0 auto;}
                h2{color:#1e293b;border-left:5px solid #4f46e5;padding-left:1rem;}
                .detail-content-print p,.detail-content-print li{font-size:0.9rem;line-height:1.5;}
                ul,ol{padding-left:1.5rem;}.badge-normativa{background:#eef2ff;padding:0.2rem 0.7rem;border-radius:1rem;font-size:0.7rem;}
                </style></head>
                <body><div class="print-container"><h2>${titulo}</h2><p style="color:#4f46e5">${subtitulo}</p><div class="detail-content-print">${contenido.innerHTML}</div><hr><p style="font-size:0.7rem;text-align:center;">Documento generado desde el sistema de Subrogación · Defensoría Oficial</p></div>
                <script>window.onload=()=>{window.print();window.onafterprint=()=>window.close();};<\/script>
                </body></html>
            `);
            printWindow.document.close();
        }

        function init() {
            renderModesList("");
            setupFilter();
            actualizarContenidoCentral(null);
            if (window.lucide) lucide.createIcons();
            document.getElementById('btnImprimir')?.addEventListener('click', imprimirDetalle);
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
