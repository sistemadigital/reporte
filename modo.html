<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Modos de Intervención | Defensoría Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .mode-item {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .mode-item:hover {
            background-color: #eef2ff;
            border-left-color: #4f46e5;
            transform: translateX(2px);
        }
        .mode-item.active {
            background-color: #e0e7ff;
            border-left-color: #1e3a8a;
            font-weight: 700;
            color: #1e1b4b;
        }
        .scroll-panel {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .scroll-panel::-webkit-scrollbar {
            width: 5px;
        }
        .scroll-panel::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .scroll-panel::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .detail-content p, .detail-content li {
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .detail-content ul {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
            list-style-type: disc;
        }
        .detail-content li {
            margin-bottom: 0.5rem;
        }
        .detail-content h4 {
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .badge-normativa {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 1.5rem;
            border-left: 3px solid #f59e0b;
        }
        /* Estilos para la impresión (solo ventana emergente) */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-content {
                display: block;
                margin: 0 auto;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

    <!-- HEADER con título y filtro de búsqueda fijo -->
    <header class="bg-indigo-950 text-white border-b-4 border-amber-500 shadow-md sticky top-0 z-10">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="badge-help" class="w-7 h-7 text-amber-400"></i>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Modos de Intervención</h1>
            </div>
            <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="filtroBusqueda" placeholder="Buscar modo de intervención..." 
                       class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white text-slate-800 shadow-sm">
            </div>
        </div>
    </header>

    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
            
            <!-- PANEL LATERAL -->
            <aside class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-indigo-50 to-slate-50 px-5 py-4 border-b border-indigo-100">
                    <h2 class="text-indigo-800 font-black text-lg flex items-center gap-2">
                        <i data-lucide="layers" class="w-5 h-5"></i> Modos de actuación
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">Haga clic para ver los detalles</p>
                </div>
                <div class="h-[calc(100vh-13rem)] overflow-y-auto scroll-panel p-2">
                    <div id="modesList" class="space-y-1.5"></div>
                </div>
                <div class="bg-indigo-50/30 px-4 py-2 text-[11px] text-slate-400 border-t border-indigo-100">
                    <i data-lucide="info" class="w-3 h-3 inline mr-1"></i> Ley IV-N.15 · Ley XII-27
                </div>
            </aside>
            
            <!-- PANEL CENTRAL -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-slate-50 to-indigo-50/30 px-6 py-5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-indigo-100 rounded-xl text-indigo-700">
                                <i data-lucide="gavel" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 id="tituloDetalle" class="text-2xl font-black text-slate-800 tracking-tight">Detalle del modo</h2>
                                <p id="subtituloDetalle" class="text-sm text-indigo-600 font-mono">Contenido específico</p>
                            </div>
                        </div>
                        <!-- BOTÓN IMPRIMIR AGREGADO -->
                        <button id="btnImprimir" class="flex items-center gap-2 bg-white hover:bg-indigo-50 text-slate-700 font-medium py-2 px-4 rounded-xl border border-slate-200 shadow-sm transition-all duration-200">
                            <i data-lucide="printer" class="w-4 h-4"></i>
                            <span class="text-sm">Imprimir</span>
                        </button>
                    </div>
                </div>
                <div id="contenedorCentral" class="p-6 md:p-8 detail-content"></div>
            </div>
        </div>
    </div>

    <script>
        // LISTA COMPLETA DE MODOS
        const modosLista = [
            "Defensor Oficial",
            "Ministerio Principal",
            "Ministerio Complementario",
            "Patrocinante Actor",
            "Patrocinante Demandado",
            "Patrocinante Tercero",
            "Defensor de Ausente",
            "Patrocinante presunto incapaz",
            "Asesor Letrado",
            "Ministerio Público del incapaz",
            "Ministerio Público en turno Abril",
            "Ministerio Público en turno Agosto",
            "Ministerio Público en turno Diciembre",
            "Asistencia Letrada del incapaz",
            "Tutor Ad Litem",
            "Defensor Oficial Art 329 CPCC",
            "Defensor Oficial Art 626 CPCC"
        ];

        let currentMode = null;
        let currentFilter = "";

        // ==================== CONTENIDO: Defensor Art. 626 ====================
        function contenidoArt626() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-amber-50 to-indigo-50 rounded-xl p-5 border-l-8 border-indigo-600 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-indigo-700"><i data-lucide="scale" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Artículo 626 de la Ley XII – Nº 27 (Digesto Jurídico de la Provincia de Misiones, anteriormente Código Procesal Civil y Comercial)</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-4"><i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i> Obligatoriedad del reconocimiento judicial y la intervención del Defensor Oficial</h3>
                        <p class="text-slate-700 mb-4">El artículo establece la obligatoriedad del reconocimiento judicial en procesos de desalojo específicos y la intervención del Defensor Oficial para garantizar la legalidad del acto.</p>
                        <h4><i data-lucide="check-circle" class="w-4 h-4"></i> Casos de aplicación</h4>
                        <p class="text-slate-700">Se aplica cuando el desalojo se funda en causales de: cambio de destino, deterioro del inmueble, intrusión, obras nocivas, uso abusivo o deshonesto.</p>
                        <h4><i data-lucide="gavel" class="w-4 h-4"></i> Procedimiento</h4>
                        <p class="text-slate-700">El Juez debe realizar un <strong>reconocimiento judicial del inmueble</strong> antes del traslado de la demanda.</p>
                        <h4><i data-lucide="calendar" class="w-4 h-4"></i> Plazo</h4>
                        <p class="text-slate-700">Dentro de los <strong>cinco (5) días</strong> de dictada la primera providencia.</p>
                        <h4><i data-lucide="users" class="w-4 h-4"></i> Intervención del Defensor</h4>
                        <p class="text-slate-700">Asistencia <strong>obligatoria del Defensor Oficial</strong> para asegurar la regularidad del procedimiento y proteger derechos.</p>
                        <div class="mt-5 p-4 bg-indigo-50 rounded-lg border-l-4 border-indigo-500 text-sm">
                            <i data-lucide="info" class="w-4 h-4 inline text-indigo-700 mr-2"></i>
                            <span class="text-indigo-900 font-medium">Objetivo:</span> que el magistrado tome contacto directo con el estado del inmueble y la situación de sus ocupantes de manera temprana.
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Ley XII – Nº 27 · #DefensorOficialArt626</div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Defensor Art. 329 ====================
        function contenidoArt329() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-5 border-l-8 border-indigo-600 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-indigo-700"><i data-lucide="scale" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Artículo 329 de la Ley XII – Nº 27 – Diligencias preliminares y responsabilidad por incumplimiento</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-4"><i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i> Responsabilidad por incumplimiento de órdenes judiciales</h3>
                        <p class="text-slate-700 mb-4">El artículo regula la responsabilidad por incumplimiento de las órdenes judiciales en el marco de las diligencias preliminares.</p>
                        <h4><i data-lucide="alert-triangle" class="w-4 h-4"></i> Sanciones por incumplimiento</h4>
                        <p class="text-slate-700">Si una persona interpelada (sin causa justa) no cumple con la orden del Juez en el plazo fijado, u oculta/destruye elementos solicitados, el Juez puede:</p>
                        <ul><li>Imponer una multa.</li><li>Si se trata de la exhibición de un testamento (Art. 323 inc. 1), ordenar el secuestro del mismo.</li></ul>
                        <h4><i data-lucide="users" class="w-4 h-4"></i> Intervención del Defensor Oficial</h4>
                        <p class="text-slate-700">El Juez debe acceder a las pretensiones de medidas preliminares si estima justas las causas, pero debe <strong>dar intervención al Defensor Oficial</strong> para que represente y asegure los derechos de la futura parte contraria en casos específicos.</p>
                        <h4><i data-lucide="book-open" class="w-4 h-4"></i> Causales específicas</h4>
                        <p class="text-slate-700">Esta intervención obligatoria se refuerza cuando se invocan causales del Código Civil y Comercial relacionadas con el <strong>deterioro o uso abusivo de bienes</strong> (arts. 1206 y 1219 inc. b), garantizando así que el procedimiento no vulnere derechos de defensa antes de la demanda formal.</p>
                        <div class="mt-5 p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500 text-sm">
                            <i data-lucide="info" class="w-4 h-4 inline text-blue-700 mr-2"></i>
                            <span class="text-blue-900 font-medium">Diferencia clave con el art. 626:</span>
                            <p class="text-slate-700 mt-1">Mientras el art. 626 se enfoca en el desalojo y el reconocimiento del inmueble, <strong>el art. 329 se centra en la etapa previa (medidas preliminares)</strong> y en la protección del derecho de defensa a través del Ministerio Público ante posibles reticencias u ocultamientos de información.</p>
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Ley XII – Nº 27 · #DefensorOficialArt329</div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Ministerio Complementario ====================
        function contenidoMinisterioComplementario() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-xl p-5 border-l-8 border-emerald-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-emerald-700"><i data-lucide="shield" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Ministerio Público Complementario (o Pupilar) – Ley IV-Nº 15 y Ley XII-Nº 27</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">En la Provincia de Misiones, el Ministerio Público Complementario tiene como función principal actuar como un <strong>"segundo nivel" de protección</strong> para garantizar que no se vulneren los derechos de personas vulnerables en procesos judiciales.</p>
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-3 mt-4"><i data-lucide="list-checks" class="w-5 h-5 text-emerald-600"></i> Funciones clave</h3>
                        <h4><i data-lucide="users" class="w-4 h-4"></i> 1. Representación Promiscua (Acompañamiento)</h4>
                        <p class="text-slate-700">Su actuación es complementaria a la de los representantes legales (padres, tutores o curadores). No los reemplaza, sino que <strong>vigila que estos cumplan correctamente su rol</strong>. Interviene obligatoriamente en causas que involucren a:</p>
                        <ul><li>Niños, niñas y adolescentes.</li><li>Personas con capacidad restringida o declaradas incapaces.</li></ul>
                        <h4><i data-lucide="scale" class="w-4 h-4"></i> 2. Control de Legalidad y Orden Público</h4>
                        <p class="text-slate-700">El Ministerio Complementario vela por el <strong>Interés Superior del Niño</strong> y el respeto al debido proceso. Sus funciones específicas incluyen:</p>
                        <ul>
                            <li><strong>Dictaminar:</strong> Emitir opiniones técnicas antes de que el Juez tome decisiones que afecten los bienes o derechos de los protegidos.</li>
                            <li><strong>Asistir a audiencias:</strong> Participar en los actos procesales para asegurar que la voz del menor o incapaz sea escuchada y respetada.</li>
                            <li><strong>Peticionar medidas:</strong> Solicitar al Juez cualquier medida urgente de protección de personas, orfandad o peligro moral.</li>
                        </ul>
                        <h4><i data-lucide="building-2" class="w-4 h-4"></i> 3. Funciones en la Justicia de Paz</h4>
                        <p class="text-slate-700">En localidades más pequeñas, los Jueces de Paz tienen el deber de informar al Ministerio Pupilar sobre casos de abandono o peligro material de menores, pudiendo tomar medidas de urgencia hasta que el Defensor Oficial competente intervenga.</p>
                        <h4><i data-lucide="refresh-cw" class="w-4 h-4"></i> 4. Suplencia (Representación Principal)</h4>
                        <p class="text-slate-700">Actúa de forma principal (reemplazando al representante legal) únicamente cuando:</p>
                        <ul>
                            <li>Hay un <strong>conflicto de intereses</strong> entre el menor/incapaz y sus padres o tutores (ej. juicio de filiación o contra los propios padres).</li>
                            <li>El menor <strong>carece de representantes legales</strong> o estos están impedidos de actuar.</li>
                        </ul>
                        <div class="mt-5 p-4 bg-emerald-50 rounded-lg border-l-4 border-emerald-500 text-sm">
                            <i data-lucide="info" class="w-4 h-4 inline text-emerald-700 mr-2"></i>
                            <span class="text-emerald-900 font-medium">Marco normativo:</span>
                            <p class="text-slate-700 mt-1">Ley IV – Nº 15 (Ley Orgánica del Poder Judicial) y Ley XII – Nº 27 (CPCC).</p>
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Ley IV-N.15 · Ley XII-27 · #MinisterioComplementario</div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Ministerio Principal ====================
        function contenidoMinisterioPrincipal() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-purple-50 to-fuchsia-50 rounded-xl p-5 border-l-8 border-purple-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-purple-700"><i data-lucide="crown" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Ministerio Público Principal – Representación directa y exclusiva (Ley IV-Nº 15 y Ley XII-Nº 27)</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">En el ordenamiento jurídico de Misiones, el <strong>Ministerio Público Principal</strong> es el rol que asumen los funcionarios (generalmente el Defensor Oficial) cuando <strong>no actúan simplemente "acompañando"</strong>, sino que ejercen la representación directa y exclusiva de la persona en el juicio.</p>
                        <p class="text-slate-700 mb-4">A diferencia del rol "complementario" (donde ya hay un abogado o tutor), aquí el funcionario es el <strong>único responsable de defender los intereses del sujeto</strong>.</p>
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-3 mt-4"><i data-lucide="list-checks" class="w-5 h-5 text-purple-600"></i> Escenarios de actuación principal</h3>
                        <h4><i data-lucide="alert-circle" class="w-4 h-4"></i> 1. Ausencia de Representación (Orfandad de defensa)</h4>
                        <p class="text-slate-700">Cuando una persona no tiene quién la represente legalmente. Por ejemplo:</p>
                        <ul>
                            <li>Niños o personas con capacidad restringida que no tienen padres, tutores o curadores designados.</li>
                            <li>Personas que, por su situación de vulnerabilidad o pobreza, no pueden designar un abogado particular.</li>
                        </ul>
                        <h4><i data-lucide="users" class="w-4 h-4"></i> 2. Conflicto de Intereses</h4>
                        <p class="text-slate-700">Es uno de los casos más comunes. El Ministerio Público pasa de ser complementario a Principal cuando existe una pelea legal entre el protegido y su representante natural.</p>
                        <p class="text-slate-700"><strong>Ejemplo:</strong> Un juicio donde un hijo demanda a su padre por la administración de bienes. Como el padre no puede representar al hijo (por ser la contraparte), el Defensor Oficial asume la representación principal del menor.</p>
                        <h4><i data-lucide="clock" class="w-4 h-4"></i> 3. Inacción de los Representantes Legales</h4>
                        <p class="text-slate-700">Si los padres o tutores son negligentes o no realizan las acciones necesarias para proteger los derechos del niño o incapaz, el Ministerio Público tiene la facultad (y el deber) de desplazarlos o actuar por encima de ellos.</p>
                        <div class="mt-5 p-4 bg-purple-50 rounded-lg border-l-4 border-purple-500 text-sm">
                            <i data-lucide="git-compare" class="w-4 h-4 inline text-purple-700 mr-2"></i>
                            <span class="text-purple-900 font-medium">Diferencia clave:</span>
                            <p class="text-slate-700 mt-2"><strong>Complementario:</strong> control y opinión.<br><strong>Principal:</strong> toma las riendas del caso, firma escritos y define la estrategia.</p>
                        </div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Ley IV-N.15 · Ley XII-27 · #MinisterioPrincipal</div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Patrocinante Actor ====================
        function contenidoPatrocinanteActor() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-rose-50 to-orange-50 rounded-xl p-5 border-l-8 border-rose-600 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-rose-700"><i data-lucide="user-plus" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Patrocinante de la Parte Actora – Defensor Oficial</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">El Defensor Oficial asume este rol cuando el ciudadano desea iniciar una acción judicial y carece de medios económicos.</p>
                        <h4><i data-lucide="file-text" class="w-4 h-4"></i> Beneficio de Litigar sin Gastos</h4>
                        <p class="text-slate-700">Es la situación típica. El <strong>artículo 85 de la Ley XII - N.º 27</strong> establece que la representación y defensa de quien obtiene este beneficio debe ser asumida por el Defensor Oficial, a menos que el interesado prefiera un abogado particular.</p>
                        <h4><i data-lucide="heart" class="w-4 h-4"></i> Calidad de Pobreza</h4>
                        <p class="text-slate-700">El <strong>artículo 114 de la Ley IV – N.º 15</strong> impone el deber de patrocinar a quienes acrediten tal condición ante el funcionario.</p>
                        <div class="mt-4 p-3 bg-indigo-50 rounded-lg text-xs"><i data-lucide="info" class="w-3 h-3 inline mr-1"></i> El patrocinio es gratuito, pero si el patrocinado mejora su fortuna o gana el pleito con beneficios económicos, el Defensor puede reclamar costas (honorarios) que generalmente van a fondos del Poder Judicial.</div>
                        <div class="mt-3 text-sm text-slate-500"><span class="badge-normativa">Art. 85 Ley XII-27</span> <span class="badge-normativa ml-2">Art. 114 Ley IV-15</span></div>
                    </div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Patrocinante Demandado ====================
        function contenidoPatrocinanteDemandado() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-sky-50 to-blue-50 rounded-xl p-5 border-l-8 border-sky-600 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-sky-700"><i data-lucide="user-check" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Patrocinante de la Parte Demandada – Defensor Oficial</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">Actúa en defensa de quien ha sido demandado y no cuenta con asistencia letrada, en dos escenarios principales:</p>
                        <h4><i data-lucide="shield" class="w-4 h-4"></i> Demandado con Beneficio de Pobreza</h4>
                        <p class="text-slate-700">Al igual que el actor, si el demandado prueba que no puede pagar un abogado, el Estado le garantiza la defensa técnica a través de la Defensoría.</p>
                        <h4><i data-lucide="newspaper" class="w-4 h-4"></i> Ausentes Citados por Edictos</h4>
                        <p class="text-slate-700">Si una persona es demandada y, tras ser citada por edictos, no se presenta, el Defensor Oficial asume su representación para evitar la indefensión y garantizar que el proceso sea válido (Art. 329 y concordantes de la Ley XII - N.º 27).</p>
                        <div class="mt-4 p-3 bg-indigo-50 rounded-lg text-xs"><i data-lucide="info" class="w-3 h-3 inline mr-1"></i> La intervención del Defensor en estos casos asegura el debido proceso y evita nulidades por falta de defensa técnica.</div>
                        <div class="mt-3 text-sm text-slate-500"><span class="badge-normativa">Art. 329 Ley XII-27</span> <span class="badge-normativa ml-2">Art. 114 Ley IV-15</span></div>
                    </div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Patrocinante Tercero ====================
        function contenidoPatrocinanteTercero() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-teal-50 to-green-50 rounded-xl p-5 border-l-8 border-teal-600 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-teal-700"><i data-lucide="users" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Patrocinante de Terceros – Defensor Oficial</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">Interviene cuando un tercero con interés legítimo en el pleito se encuentra en situación de vulnerabilidad o pobreza.</p>
                        <h4><i data-lucide="alert-triangle" class="w-4 h-4"></i> Terceros Vulnerables</h4>
                        <p class="text-slate-700">Si el proceso afecta derechos de personas que no son las partes principales pero que tienen un derecho que defender (por ejemplo, en conflictos de propiedad o familia) y no tienen recursos, pueden solicitar el patrocinio oficial.</p>
                        <h4><i data-lucide="baby" class="w-4 h-4"></i> Representación de Menores o Incapaces</h4>
                        <p class="text-slate-700">Si hay un conflicto con sus representantes naturales, el Defensor actúa como patrocinante principal de este "tercero" protegido por la ley.</p>
                        <div class="mt-4 p-3 bg-indigo-50 rounded-lg text-xs"><i data-lucide="info" class="w-3 h-3 inline mr-1"></i> El deber de excusación: el funcionario no puede actuar si existe conflicto de intereses (por ejemplo, si ya patrocina a la otra parte en ese u otro juicio).</div>
                        <div class="mt-3 text-sm text-slate-500"><span class="badge-normativa">Arts. 90, 91 CPC</span> <span class="badge-normativa ml-2">Ley IV-15 art. 118</span></div>
                    </div>
                </div>
            `;
        }

        // ==================== CONTENIDO: Tutor Ad Litem ====================
        function conteníoTutorAdLitem() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-50 to-violet-50 rounded-xl p-5 border-l-8 border-violet-700 shadow-sm">
                        <div class="flex items-start gap-3">
                            <div class="bg-white rounded-full p-2 shadow-sm text-violet-700"><i data-lucide="scale" class="w-5 h-5"></i></div>
                            <div><p class="text-slate-700 text-base font-medium">Defensor Tutor ad litem – Representación judicial específica</p></div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <p class="text-slate-700 mb-4">En la legislación de Misiones, la figura del <strong>Defensor Tutor ad litem</strong> es una función específica y excepcional que asume el Defensor Oficial para representar a un niño, niña, adolescente o persona con capacidad restringida exclusivamente para un proceso judicial determinado.</p>
                        <p class="text-slate-700 mb-4">A diferencia de la tutela común (que es para la vida diaria), esta es <strong>"para el pleito" (ad litem)</strong>. Según la Ley XII – Nº 27 y el Código Civil y Comercial de la Nación (de aplicación supletoria en Misiones), actúa en este rol en los siguientes casos:</p>
                        
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-3 mt-4"><i data-lucide="list-checks" class="w-5 h-5 text-violet-600"></i> Escenarios de actuación</h3>
                        
                        <h4><i data-lucide="alert-triangle" class="w-4 h-4"></i> 1. Conflicto de Intereses con los Padres o Tutores</h4>
                        <p class="text-slate-700">Es la causa más frecuente. Si el representante legal (padre/madre) tiene un interés opuesto al del menor en un juicio, el Juez desplaza esa representación y nombra al Defensor Oficial como Tutor ad litem para que defienda al niño de forma independiente.</p>
                        <p class="text-slate-700"><strong>Ejemplo:</strong> Un juicio por daños y perjuicios donde el padre quiere transar un monto que perjudica al hijo, o juicios de filiación.</p>
                        
                        <h4><i data-lucide="user-x" class="w-4 h-4"></i> 2. Falta de Representante Legal</h4>
                        <p class="text-slate-700">Cuando el niño o la persona incapaz no tiene a nadie que ejerza su responsabilidad parental o tutela y debe intervenir en un juicio (ya sea como actor o demandado). El Juez le asigna este tutor oficial para que el proceso no se detenga y se garantice su defensa.</p>
                        
                        <h4><i data-lucide="thumbs-down" class="w-4 h-4"></i> 3. Oposición injustificada del representante</h4>
                        <p class="text-slate-700">Si el padre o tutor se niega a iniciar una acción legal que es claramente beneficiosa para el menor (o a defenderlo en una que le perjudica), el Ministerio Público solicita actuar como Tutor ad litem para suplir esa inacción.</p>
                        
                        <h4><i data-lucide="shield" class="w-4 h-4"></i> 4. Procesos de Control de Legalidad (Protección de Persona)</h4>
                        <p class="text-slate-700">En medidas excepcionales de protección (cuando se retira a un niño de su hogar por riesgo), el Defensor Oficial suele ser designado como tutor ad litem para asegurar que el niño tenga una voz propia y técnica frente a las decisiones del órgano administrativo y del Juez.</p>
                        
                        <div class="mt-5 p-4 bg-violet-50 rounded-lg border-l-4 border-violet-500 text-sm">
                            <i data-lucide="git-compare" class="w-4 h-4 inline text-violet-700 mr-2"></i>
                            <span class="text-violet-900 font-medium">Diferencias clave en su actuación:</span>
                            <ul class="mt-2 text-slate-700">
                                <li><strong>No es "Complementario":</strong> Aquí el Defensor no solo opina, sino que es quien firma la demanda o la contestación como si fuera el tutor real.</li>
                                <li><strong>Es Temporal:</strong> Su función termina cuando finaliza el juicio o cuando desaparece la causa que originó el nombramiento (por ejemplo, si se nombra un tutor definitivo).</li>
                                <li><strong>Es Específico:</strong> Se lo nombra en el expediente mediante una resolución judicial que dice: "Desígnase al Defensor Oficial en turno como Tutor ad litem del menor...".</li>
                            </ul>
                        </div>
                        <div class="mt-3 text-sm text-slate-500"><span class="badge-normativa">Arts. 103, 104 CCCN</span> <span class="badge-normativa ml-2">Ley XII-27 arts. 713, 714</span></div>
                    </div>
                    <div class="text-xs text-slate-400 border-t pt-4"><i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> Ley IV-N.15 · Ley XII-27 · CCCN · #TutorAdLitem</div>
                </div>
            `;
        }

        // ==================== PLACEHOLDER ====================
        function contenidoPlaceholder() {
            return `
                <div class="flex flex-col items-center justify-center text-center py-12">
                    <i data-lucide="inbox" class="w-20 h-20 text-slate-300 mb-4"></i>
                    <p class="text-slate-500 text-base max-w-md">Seleccione un modo de intervención del panel izquierdo.<br>El contenido detallado se agregará posteriormente.</p>
                    <div class="mt-6 bg-amber-50 rounded-xl px-4 py-2 text-xs text-amber-800 inline-flex gap-1">
                        <i data-lucide="clock" class="w-3 h-3"></i>
                        <span>Espacio reservado para la descripción y pasos operativos</span>
                    </div>
                </div>
            `;
        }

        // ==================== ACTUALIZAR CONTENIDO CENTRAL ====================
        function actualizarContenidoCentral(modo) {
            const contenedor = document.getElementById('contenedorCentral');
            const tituloElem = document.getElementById('tituloDetalle');
            const subtituloElem = document.getElementById('subtituloDetalle');
            if (!contenedor) return;

            if (modo === "Defensor Oficial Art 626 CPCC") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Art. 626 Ley XII-27 · Reconocimiento judicial y desalojo";
                contenedor.innerHTML = contenidoArt626();
            } 
            else if (modo === "Defensor Oficial Art 329 CPCC") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Art. 329 Ley XII-27 · Medidas preliminares y Defensor Oficial";
                contenedor.innerHTML = contenidoArt329();
            }
            else if (modo === "Ministerio Complementario") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Ley IV-N.15 · Representación promiscua y control de legalidad";
                contenedor.innerHTML = contenidoMinisterioComplementario();
            }
            else if (modo === "Ministerio Principal") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Ley IV-N.15 · Representación directa y exclusiva";
                contenedor.innerHTML = contenidoMinisterioPrincipal();
            }
            else if (modo === "Patrocinante Actor") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Art. 85 Ley XII-27 · Beneficio de litigar sin gastos";
                contenedor.innerHTML = contenidoPatrocinanteActor();
            }
            else if (modo === "Patrocinante Demandado") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Art. 329 Ley XII-27 · Defensa técnica garantizada";
                contenedor.innerHTML = contenidoPatrocinanteDemandado();
            }
            else if (modo === "Patrocinante Tercero") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Intervención de terceros vulnerables";
                contenedor.innerHTML = contenidoPatrocinanteTercero();
            }
            else if (modo === "Tutor Ad Litem") {
                tituloElem.innerText = modo;
                subtituloElem.innerText = "Representación judicial específica para el proceso";
                contenedor.innerHTML = conteníoTutorAdLitem();
            }
            else {
                tituloElem.innerText = modo || "Detalle del modo";
                subtituloElem.innerText = "Contenido pendiente";
                contenedor.innerHTML = contenidoPlaceholder();
            }
            
            if (window.lucide) lucide.createIcons();
        }

        // ==================== FUNCIÓN PARA IMPRIMIR SÓLO EL DETALLE ====================
        function imprimirDetalle() {
            const titulo = document.getElementById('tituloDetalle')?.innerText || 'Detalle del modo';
            const subtitulo = document.getElementById('subtituloDetalle')?.innerText || '';
            const contenido = document.getElementById('contenedorCentral')?.cloneNode(true);
            if (!contenido) return;

            // Crear estructura para impresión
            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                alert('Por favor, permita ventanas emergentes para imprimir.');
                return;
            }
            
            // Estilos para la impresión (se reutilizan los básicos y se mejora márgenes)
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>${titulo} - Defensoría Oficial</title>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
                    <style>
                        body {
                            font-family: 'Inter', sans-serif;
                            margin: 0;
                            padding: 2rem;
                            background: white;
                            color: #0f172a;
                        }
                        .print-container {
                            max-width: 900px;
                            margin: 0 auto;
                        }
                        .print-titulo {
                            font-size: 1.8rem;
                            font-weight: 800;
                            color: #1e293b;
                            border-left: 5px solid #4f46e5;
                            padding-left: 1rem;
                            margin-bottom: 0.25rem;
                        }
                        .print-subtitulo {
                            font-size: 0.85rem;
                            font-weight: 500;
                            color: #4f46e5;
                            margin-bottom: 2rem;
                            border-bottom: 1px solid #e2e8f0;
                            padding-bottom: 0.75rem;
                        }
                        .detail-content-print p, .detail-content-print li {
                            font-size: 0.95rem;
                            line-height: 1.5;
                            color: #1e293b;
                        }
                        .detail-content-print ul {
                            margin: 0.75rem 0;
                            padding-left: 1.5rem;
                            list-style-type: disc;
                        }
                        .detail-content-print li {
                            margin-bottom: 0.5rem;
                        }
                        .detail-content-print h4 {
                            font-weight: 700;
                            margin-top: 1.25rem;
                            margin-bottom: 0.5rem;
                            display: flex;
                            align-items: center;
                            gap: 0.25rem;
                            font-size: 1rem;
                        }
                        .badge-normativa {
                            display: inline-block;
                            background: #eef2ff;
                            color: #1e3a8a;
                            font-size: 0.7rem;
                            font-weight: 700;
                            padding: 0.25rem 0.75rem;
                            border-radius: 1.5rem;
                            border-left: 3px solid #f59e0b;
                        }
                        .print-footer {
                            margin-top: 2rem;
                            font-size: 0.7rem;
                            color: #94a3b8;
                            text-align: center;
                            border-top: 1px solid #e2e8f0;
                            padding-top: 1rem;
                        }
                    </style>
                </head>
                <body>
                    <div class="print-container">
                        <div class="print-titulo">${escapeHtml(titulo)}</div>
                        <div class="print-subtitulo">${escapeHtml(subtitulo)}</div>
                        <div class="detail-content-print">${contenido.innerHTML}</div>
                        <div class="print-footer">
                            Documento generado desde el sistema de Modos de Intervención · Defensoría Oficial
                        </div>
                    </div>
                    <script>
                        window.onload = () => {
                            window.print();
                            window.onafterprint = () => window.close();
                        };
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // Helper para escapar HTML en títulos (prevenir inyección)
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // ==================== RENDER LISTA CON FILTRO ====================
        function renderModesList(filterText = "") {
            const container = document.getElementById('modesList');
            if (!container) return;
            const lowerFilter = filterText.toLowerCase();
            const filteredModes = modosLista.filter(modo => modo.toLowerCase().includes(lowerFilter));
            if (filteredModes.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-slate-400 text-sm">🔍 Ningún modo coincide con "${filterText}"</div>`;
                return;
            }
            let html = '';
            filteredModes.forEach(modo => {
                const isActive = (modo === currentMode);
                const activeClass = isActive ? 'active' : '';
                html += `<div class="mode-item ${activeClass} p-3 rounded-xl cursor-pointer transition-all flex items-center gap-2" data-modo="${modo}">
                            <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 text-xs font-black">${isActive ? '✓' : '•'}</div>
                            <span class="text-sm font-medium text-slate-700">${modo}</span>
                         </div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.mode-item').forEach(el => {
                el.addEventListener('click', () => {
                    const modo = el.getAttribute('data-modo');
                    if (modo) setCurrentMode(modo);
                });
            });
            if (window.lucide) lucide.createIcons();
        }

        function setCurrentMode(modo) {
            currentMode = modo;
            renderModesList(currentFilter);
            actualizarContenidoCentral(modo);
        }

        function setupFilter() {
            const filterInput = document.getElementById('filtroBusqueda');
            if (!filterInput) return;
            filterInput.addEventListener('input', (e) => {
                currentFilter = e.target.value;
                renderModesList(currentFilter);
                if (currentMode && !currentMode.toLowerCase().includes(currentFilter.toLowerCase())) {
                    currentMode = null;
                    renderModesList(currentFilter);
                    actualizarContenidoCentral(null);
                }
            });
        }

        function init() {
            renderModesList("");
            setupFilter();
            actualizarContenidoCentral(null);
            if (window.lucide) lucide.createIcons();

            // Evento del botón imprimir
            const btnImprimir = document.getElementById('btnImprimir');
            if (btnImprimir) {
                btnImprimir.addEventListener('click', imprimirDetalle);
            }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
