<!DOCTYPE html>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-indigo-100 rounded-xl text-indigo-700">
                                <span>⚖️</span>
                            </div>

                        </div>

                            <span>🖨️</span>

                <!-- Recordatorio eliminado -->
