<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte del Sistema</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Firebase y Chart.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root{
  --navy:#0b2a6f; --navy-d:#081c4d; --b7:#1849c4; --b6:#2160e8; --b5:#3b7bf5;
  --b2:#c3d7ff; --b1:#eef4ff; --ink:#0f1b3d; --mute:#5a6a8a; --rule:#dde5f3;
  --field:#c9d5ec; --bg:#f4f7fd;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --pad:clamp(14px,3vw,28px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;display:flex;flex-direction:column;font:15px/1.55 var(--ff);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--b5);outline-offset:2px}
.wrap{width:min(1200px,calc(100% - 2*var(--pad)));margin-inline:auto}

/* Panel superior */
.top{background:var(--navy);color:#fff;padding:18px 0}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:clamp(18px,2.6vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.2}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:600;line-height:1.2;cursor:pointer;transition:background .15s,border-color .15s}
.btn.solid{background:var(--b6);color:#fff}
.btn.solid:hover:not(:disabled){background:var(--b7)}
.btn.line{background:#fff;color:var(--b7);border-color:var(--b2)}
.btn.line:hover:not(:disabled){background:var(--b1)}
.btn.onnavy{background:#fff;color:var(--navy)}
.btn.onnavy:hover{background:var(--b1)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{flex:1;padding:24px 0 40px}

/* Tarjeta */
.card{background:#fff;border:1px solid var(--rule);border-radius:18px;box-shadow:0 1px 2px rgba(11,42,111,.05),0 12px 28px -18px rgba(11,42,111,.25)}
.pad{padding:clamp(18px,2.6vw,28px)}
.card h2{font-size:clamp(17px,2.2vw,20px);font-weight:700;letter-spacing:-.015em}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.ttl .l{display:flex;align-items:center;gap:10px}
.ttl i{color:var(--b6)}
.ttl small{display:block;font-size:12.5px;font-weight:500;color:var(--mute)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px}
.kpi b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--b7);line-height:1.1}
.kpi span{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}

/* Gráfico */
.chartbox{position:relative;height:340px}
.sub-h{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px}

/* Tabla */
.scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse}
table.dt th{padding:11px 10px;text-align:left;background:var(--b1);color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
table.dt td{padding:10px;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.4;vertical-align:middle;overflow-wrap:anywhere}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
table.dt td.n{font-weight:700}
table.dt tbody tr:hover{background:var(--b1)}
table.dt tbody tr:last-child td{border-bottom:0}
.pbar{display:inline-block;width:80px;height:8px;margin-right:8px;vertical-align:middle;border-radius:99px;background:var(--b1)}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--b6)}
.empty{padding:36px 16px!important;text-align:center;color:var(--mute)}
.loader{text-align:center;padding:48px 16px;color:var(--mute)}

/* Informe trimestral */
.frame{width:100%;height:calc(100vh - 170px);min-height:520px;border:1px solid var(--rule);border-radius:18px;background:#fff}

footer{padding:16px 0;border-top:1px solid var(--rule);background:#fff;color:var(--mute);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.printhead{display:none}

@media (max-width:720px){
  .kpis{grid-template-columns:1fr}
  .chartbox{height:280px}
}

@media print{
  @page{margin:1.5cm}
  body{background:#fff}
  .top,footer,.noprint{display:none!important}
  main{padding:0}
  .wrap{width:100%}
  .card{border:0;box-shadow:none}
  .pad{padding:0}
  .printhead{display:block;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--navy)}
  .printhead h1{font-size:20px;color:var(--navy)}
  .printhead p{font-size:12px;color:var(--mute)}
  .kpi{border:1px solid var(--rule);box-shadow:none}
  .chartbox{height:300px;break-inside:avoid}
  table.dt th{background:var(--b1)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}
</style>
</head>
<body>

<!-- Panel superior -->
<header class="top">
  <div class="wrap">
    <h1>Reporte del Sistema</h1>
    <button class="btn onnavy" id="btnInforme" type="button">
      <i class="fas fa-file-lines"></i><span id="btnInformeTxt">Informe Trimestral Oficial</span>
    </button>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- Vista: Prioridad-Intervención -->
    <section id="vistaReporte">
      <div class="printhead">
        <h1>Reporte del Sistema — Prioridad e Intervención</h1>
        <p>Defensoría Civil y Comercial 6 · Ministerio Público Misiones · Emitido: <span id="fechaImpresion"></span></p>
      </div>
      <div id="reporteContenido"><div class="loader"><i class="fas fa-spinner fa-pulse"></i> Cargando datos...</div></div>
    </section>

    <!-- Vista: Informe trimestral -->
    <section id="vistaInforme" hidden>
      <iframe class="frame" id="frameInforme" title="Informe Trimestral Oficial"></iframe>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <div><strong>Defensoría Civil y Comercial 6</strong> · Ministerio Público Misiones</div>
    <div><i class="far fa-calendar-alt"></i> <span id="current-date"></span></div>
  </div>
</footer>

<script>
    // ======================= CONFIGURACIÓN FIREBASE (HISTÓRICA + NUEVA) =======================
    const firebaseConfigHistorica = {
        apiKey: "AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",
        authDomain: "causas-defensoria.firebaseapp.com",
        projectId: "causas-defensoria",
        storageBucket: "causas-defensoria.appspot.com",
        messagingSenderId: "186064671470",
        appId: "1:186064671470:web:b58bae5eadbe6e469f19ff"
    };
    const firebaseConfigNueva = {
        apiKey: "AIzaSyBevCwkh4iOWVqhp3gG2ae1eCUMkFpnr6I",
        authDomain: "causas-2defensoria.firebaseapp.com",
        projectId: "causas-2defensoria",
        storageBucket: "causas-2defensoria.firebasestorage.app",
        messagingSenderId: "663905632804",
        appId: "1:663905632804:web:4f686a88004dc642ad0eb1"
    };

    let dbNueva, dbHistorica;
    try {
        let appNueva = firebase.initializeApp(firebaseConfigNueva, "nueva");
        let appHistorica = firebase.initializeApp(firebaseConfigHistorica, "historica");
        dbNueva = appNueva.firestore();
        dbHistorica = appHistorica.firestore();
        console.log("Firebase inicializado: ambas bases disponibles");
    } catch (e) {
        console.error("Error init Firebase", e);
    }

    // Helper: obtener todas las causas de ambas bases
    async function obtenerTodasLasCausas() {
        let causas = [];
        try {
            if (dbNueva) {
                const snapNueva = await dbNueva.collection("causas").get();
                causas.push(...snapNueva.docs.map(d => ({ id: d.id, ...d.data(), origen: 'nueva' })));
            }
            if (dbHistorica) {
                const snapHistorica = await dbHistorica.collection("causas").get();
                causas.push(...snapHistorica.docs.map(d => ({ id: d.id, ...d.data(), origen: 'historica' })));
            }
        } catch (err) {
            console.warn("Error al obtener causas:", err);
        }
        return causas;
    }

    // ======================= REPORTE PRIORIDAD-INTERVENCIÓN =======================
    let chartIntervencion = null;

    function esc(s) {
        return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    async function renderPrioridadIntervencion() {
        const cont = document.getElementById("reporteContenido");
        cont.innerHTML = `<div class="loader"><i class="fas fa-spinner fa-pulse"></i> Cargando datos de prioridad e intervención...</div>`;

        const todas = await obtenerTodasLasCausas();
        const total = todas.length;
        const porPrioridad = { Alta: 0, Media: 0, Baja: 0, Ninguna: 0 };
        const porIntervencion = {};

        todas.forEach(c => {
            const prior = c.prioridad || "Ninguna";
            if (porPrioridad[prior] !== undefined) porPrioridad[prior]++;
            const inter = c.intervencion || "No especificada";
            porIntervencion[inter] = (porIntervencion[inter] || 0) + 1;
        });

        const ordenadas = Object.entries(porIntervencion).sort((a, b) => b[1] - a[1]);
        const max = ordenadas.length ? ordenadas[0][1] : 0;
        const top = ordenadas.slice(0, 10);

        cont.innerHTML = `
            <div class="kpis">
                <div class="card kpi"><b>${total}</b><span>Total expedientes</span></div>
                <div class="card kpi"><b>${Object.keys(porPrioridad).length}</b><span>Niveles de prioridad</span></div>
                <div class="card kpi"><b>${ordenadas.length}</b><span>Tipos de intervención</span></div>
            </div>

            <div class="card pad" style="margin-bottom:18px">
                <div class="ttl">
                    <div class="l"><i class="fas fa-chart-line"></i>
                        <h2>Intervenciones <small>Top 10 por cantidad</small></h2>
                    </div>
                    <button class="btn solid noprint" id="btnImprimir" type="button"><i class="fas fa-print"></i> Imprimir</button>
                </div>
                <div class="chartbox"><canvas id="chartIntervencionPI"></canvas></div>
            </div>

            <div class="card pad">
                <div class="ttl"><div class="l"><i class="fas fa-table-list"></i><h2>Detalle de intervenciones</h2></div></div>
                <div class="scroll">
                    <table class="dt">
                        <thead><tr><th>Intervención</th><th class="n">Cantidad</th><th class="n">% del total</th></tr></thead>
                        <tbody>
                            ${ordenadas.map(([k, v]) => `
                                <tr>
                                    <td>${esc(k)}</td>
                                    <td class="n">${v}</td>
                                    <td class="n"><span class="pbar"><i style="width:${max ? (v / max * 100).toFixed(0) : 0}%"></i></span>${total ? (v / total * 100).toFixed(1) : '0.0'}%</td>
                                </tr>`).join('')}
                            ${ordenadas.length === 0 ? '<tr><td colspan="3" class="empty">No hay datos</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        // Gráfico lineal
        const ctx = document.getElementById("chartIntervencionPI")?.getContext("2d");
        if (ctx) {
            if (chartIntervencion) chartIntervencion.destroy();
            chartIntervencion = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: top.map(i => i[0]),
                    datasets: [{
                        label: 'Cantidad',
                        data: top.map(i => i[1]),
                        borderColor: '#2160e8',
                        backgroundColor: 'rgba(33,96,232,.12)',
                        pointBackgroundColor: '#1849c4',
                        pointRadius: 4,
                        borderWidth: 2.5,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#5a6a8a', font: { family: 'Inter' } }, grid: { display: false } },
                        y: { beginAtZero: true, ticks: { precision: 0, color: '#5a6a8a', font: { family: 'Inter' } }, grid: { color: '#dde5f3' } }
                    }
                }
            });
        }

        document.getElementById("btnImprimir")?.addEventListener("click", imprimirReporte);
    }

    function imprimirReporte() {
        document.getElementById("fechaImpresion").textContent = new Date().toLocaleString('es-AR');
        if (chartIntervencion) chartIntervencion.resize();
        window.print();
    }

    // ======================= INFORME TRIMESTRAL =======================
    const INFORME_URL = "https://sistema-secretarios.github.io/estadistica/";
    const btnInforme = document.getElementById('btnInforme');
    const btnInformeTxt = document.getElementById('btnInformeTxt');
    const vistaReporte = document.getElementById('vistaReporte');
    const vistaInforme = document.getElementById('vistaInforme');
    const frameInforme = document.getElementById('frameInforme');
    let informeAbierto = false;

    btnInforme.addEventListener('click', () => {
        informeAbierto = !informeAbierto;
        vistaReporte.hidden = informeAbierto;
        vistaInforme.hidden = !informeAbierto;
        if (informeAbierto && !frameInforme.src) frameInforme.src = INFORME_URL;
        btnInformeTxt.textContent = informeAbierto ? "Volver al Reporte" : "Informe Trimestral Oficial";
        btnInforme.querySelector('i').className = informeAbierto ? "fas fa-arrow-left" : "fas fa-file-lines";
    });

    // ======================= INICIO =======================
    document.getElementById('current-date').textContent =
        new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

    renderPrioridadIntervencion();
</script>
</body>
</html>
