<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Defensoría Oficial - Guía de Actuación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .legal-code { font-family: 'Roboto Mono', monospace; }
        .circles-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding-top: 2rem;
        }
        .circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }
        .circle:hover { transform: scale(1.05); }
        .circle-red { background-color: #dc2626; }
        .circle-orange { background-color: #f97316; }
        .circle-green { background-color: #10b981; }
        .proceso-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            background: white;
        }
        .proceso-card:hover {
            transform: translateX(4px);
            border-left-color: #4f46e5;
            background-color: #fefce8;
            box-shadow: 0 4px 10px -4px rgba(0,0,0,0.05);
        }
        .accordion-header {
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .accordion-header:hover {
            background-color: #eef2ff;
        }
        .normativa-destacada {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 1rem;
            border-left: 3px solid #f59e0b;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 80px 380px 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 70px 320px 1fr;
            }
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .circles-panel {
                flex-direction: row;
                justify-content: center;
                padding-top: 0;
            }
        }
        .central-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .inner-accordion-item {
            border-bottom: 1px solid #e2e8f0;
        }
        .inner-accordion-header {
            cursor: pointer;
            padding: 1rem 1.25rem;
            background-color: #faf9fe;
            transition: background 0.2s;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .inner-accordion-header:hover {
            background-color: #f1f0ff;
        }
        .inner-accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: white;
        }
        .inner-accordion-content.open {
            max-height: 1200px;
            transition: max-height 0.45s ease-in;
        }
        .rotate-chevron {
            transition: transform 0.2s ease;
        }
        .rotate-chevron.open {
            transform: rotate(180deg);
        }
        .step-list {
            list-style: none;
            padding-left: 0;
        }
        .step-list li {
            margin-bottom: 0.75rem;
            padding-left: 1.5rem;
            position: relative;
        }
        .step-list li::before {
            content: "•";
            color: #4f46e5;
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0;
            top: -2px;
        }
        .ordered-step-list {
            list-style: none;
            padding-left: 0;
            counter-reset: step-counter;
        }
        .ordered-step-list li {
            counter-increment: step-counter;
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
        }
        .ordered-step-list li::before {
            content: counter(step-counter) ".";
            color: #4f46e5;
            font-weight: 800;
            font-size: 0.9rem;
            position: absolute;
            left: 0;
            top: 0;
        }
        .table-themes {
            background: #f8fafc;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #e0e7ff;
        }
        .badge-theme {
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-content.open {
            max-height: 800px;
            transition: max-height 0.4s ease-in;
        }
        .rotate-icon {
            transition: transform 0.2s ease;
        }
        .rotate-icon.open {
            transform: rotate(180deg);
        }
        .warning-banner {
            background: #fee2e2;
            border-left: 6px solid #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
        }
        .red-warning {
            background: #ffebee;
            border-left: 6px solid #d32f2f;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #b71c1c;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .green-info {
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
        }
        .contact-numbers {
            background: #e0f2fe;
            border-left: 6px solid #0284c7;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

<header class="bg-indigo-950 text-white border-b-4 border-amber-500 no-print relative z-10 shadow-md">
    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-5 flex justify-between items-center flex-wrap gap-3">
        <div id="resetAppButton" class="cursor-pointer">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Guía de Actuación de la Defensoría Oficial</h1>
            <p class="text-indigo-300 text-xs sm:text-sm font-medium">Integral: Ley XII-27 CPC | Ley Orgánica IV-N.15 | Leyes especiales</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative header-search min-w-[240px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchProceso" placeholder="Buscar proceso o norma..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-800 shadow-sm">
            </div>
            <span class="bg-amber-500 text-indigo-950 px-3 py-1 rounded font-black text-xs whitespace-nowrap">BUSCAR EN EL LISTADO</span>
        </div>
    </div>
</header>

<div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
    <div class="main-grid">
        <div class="circles-panel">
            <div class="circle circle-red">1</div>
            <div class="circle circle-orange">2</div>
            <div class="circle circle-green">3</div>
        </div>
        <aside class="w-full bg-gradient-to-b from-slate-50 to-indigo-50 rounded-2xl shadow-xl border border-slate-200 p-4 md:p-6">
            <div class="mb-5 border-b border-indigo-200 pb-2 flex justify-between items-center">
                <h2 class="text-indigo-800 font-black text-xl flex items-center gap-2">
                    <i data-lucide="gavel" class="w-5 h-5"></i> Materias y Procesos
                </h2>
            </div>
            <div id="accordion-container" class="space-y-3"></div>
            <div class="mt-8 text-center text-xs text-slate-400 border-t pt-4">
                <i data-lucide="mouse-pointer-click" class="inline w-3 h-3 mr-1"></i> Haga clic en cada materia para desplegar sus procesos
            </div>
        </aside>
        <div id="central-dynamic-content" class="central-card">
            <div class="p-5 md:p-7" id="detail-content-area"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // CONTENIDO EXISTENTE (DEUT, CEJUME, APO, ETC.)
    // ============================================================
    
    const oficinaDeutContent = `
        <div class="space-y-3 text-slate-700">
            <p class="text-sm font-medium flex items-start gap-2"><span class="text-indigo-600 font-bold">📌 Definición oficial:</span> El <strong class="text-indigo-800">Departamento de Entrada Única de Trámites de las Defensorías Oficiales de Primera Instancia (DEUT)</strong> fue creado por Acordada del STJ del 28/05/2008 y reglamentado por Acordada N° 4/09 y Resolución de Procuración General N° 26/2009.</p>
            <div class="bg-indigo-50 p-3 rounded-lg">
                <p class="text-sm font-semibold flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4"></i> Áreas y funciones principales:</p>
                <ul class="step-list mt-2 text-sm">
                    <li><strong>Área Administrativa:</strong> Atención al público, entrega de instructivos de requisitos, carga de casos en sistema informático, asignación de la Defensoría correspondiente y remisión de informes periódicos a la Procuración General.</li>
                    <li><strong>Área Legal:</strong> Evaluación de solicitudes, evacuación de trámites simples, conexión informática con Juzgados de Familia, fijación de audiencias, confección de escritos y oficios, y derivación del caso a la Defensoría que corresponda.</li>
                </ul>
            </div>
            <div class="bg-amber-50 p-3 rounded-lg">
                <p class="text-sm font-semibold flex items-center gap-2"><i data-lucide="clipboard-list" class="w-4 h-4"></i> Procedimiento paso a paso (arts. 3 a 6 del Reglamento):</p>
                <ul class="step-list mt-2 text-sm">
                    <li><strong>Paso 1:</strong> El requirente concurre al DEUT (lunes a viernes de 7 a 12 hs). Se le entrega un instructivo con los requisitos según su pretensión.</li>
                    <li><strong>Paso 2:</strong> El personal evalúa la viabilidad y entrega un formulario específico para completar con la documentación requerida.</li>
                    <li><strong>Paso 3:</strong> Recibido el formulario completo, se da de alta la solicitud en el sistema informático y en los libros habilitados, registrando datos de las partes y la pretensión.</li>
                    <li><strong>Paso 4:</strong> En el mismo acto se determina la Defensoría Oficial que corresponderá (según materia, territorio y carga de trabajo). Se entrega constancia al interesado con el legajo asignado.</li>
                    <li><strong>Paso 5:</strong> El DEUT remite las actuaciones a la Defensoría designada, la cual continuará con la gestión del caso. El interesado recibe notificación en un plazo de 48 hs hábiles.</li>
                </ul>
            </div>
            <div class="text-xs text-slate-500 mt-1 border-t pt-2">
                <i data-lucide="scale" class="w-3 h-3 inline"></i> <strong>Normativa aplicable:</strong> Acordada STJ N° 4/09 (Reglamento DEUT) y Resolución Procuración General N° 26/2009. El DEUT funciona en la Primera Circunscripción Judicial (Posadas).
            </div>
        </div>
    `;

    const formularioCejumeContent = `
        <div class="space-y-4">
            <div class="bg-amber-50 p-4 rounded-xl border-l-4 border-amber-500">
                <h4 class="font-black text-amber-800 flex items-center gap-2"><i data-lucide="file-plus" class="w-4 h-4"></i> Formulario N° 1A (avenimiento prejudicial)</h4>
                <p class="text-sm mt-1">Se presenta firmado por la parte requirente y su asesor/a legal, en la mesa de entradas del CeJuMe, o por mail a <strong>mesadeentradascejume@jusmisiones.gov.ar</strong> (con firmas y foto del DNI).</p>
                <a href="https://drive.google.com/uc?export=download&id=1Vd2oJUb2jomGe3ngkJ_F0wfsY4Uwc0ub" target="_blank" class="inline-flex items-center gap-1 mt-2 text-indigo-700 text-sm font-bold underline">📎 Descargar Formulario APO / Instructivo</a>

            <div class="bg-sky-50 p-4 rounded-xl border-l-4 border-sky-600">

                <p class="text-sm">Al iniciar una demanda o durante el proceso, el juez puede derivar a mediación. El Juzgado presenta el formulario N° 1 en mesa de entradas del CeJuMe o al mail indicado.</p>
                <p class="text-xs text-sky-700 mt-2">⚠️ Ambos formularios habilitan la instancia prejudicial obligatoria. Para mediación temática ver alcances por circunscripción.</p>
            </div>
            <div class="text-sm bg-white p-3 rounded-lg shadow-inner">
                <i data-lucide="map-pin" class="w-4 h-4 inline text-gray-500"></i> Sedes habilitadas: Posadas, Garupá, Apóstoles, Alem (temas integrales). Oberá, Eldorado, Iguazú (solo familia/violencia). San Pedro, San Vicente (previo STJ).
            </div>
        </div>
    `;

    const cejumeMediacionContent = `
        <div class="space-y-5">
            <div class="table-themes p-4">
                <p class="font-bold text-slate-800 mb-2"><i data-lucide="list-end" class="w-4 h-4 inline mr-1"></i> ¿Qué temas se pueden tratar en CEJUME?</p>
                <div class="grid md:grid-cols-2 gap-4 text-sm">
                    <div class="bg-white rounded-lg p-3 shadow-sm border-l-4 border-emerald-500">
                        <div class="badge-theme inline-block mb-2">Por derivación judicial o avenimiento prejudicial</div>
                        <ul class="step-list mt-1">
                            <li>Cuestiones de familia: Alimentos, cuidado personal (tenencia), régimen de comunicación y contacto (régimen de visitas)</li>
                            <li>Liquidación de sociedad conyugal</li>
                            <li>Cuestiones atinentes al divorcio y a separaciones de hecho</li>
                        </ul>
                    </div>
                    <div class="bg-white rounded-lg p-3 shadow-sm border-l-4 border-purple-500">
                        <div class="badge-theme inline-block mb-2">Únicamente por derivación judicial</div>
                        <ul class="step-list mt-1">
                            <li>Cuestiones patrimoniales: Locaciones, propiedad horizontal, ejecución y resolución de contratos</li>
                            <li>Indemnizaciones por daños y perjuicios, conflictos societarios, conflictos sucesorios, etc.</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4">
                <h4 class="font-black text-indigo-800 flex gap-2 items-center"><i data-lucide="flag" class="w-4 h-4"></i> Finalización de la Mediación</h4>
                <p class="text-sm mt-2">Al finalizar el procedimiento, haya o no acuerdo, se redactará y firmará un acta. <strong>Las partes no están obligadas a llegar a un acuerdo.</strong></p>
                <ul class="step-list text-sm mt-2">
                    <li>Sin acuerdo: El acta da por finalizado el proceso de mediación. Los intervinientes pueden solicitar que el expediente vuelva al Juzgado (si es derivado) o iniciar el debido proceso judicial (en caso de avenimiento prejudicial).</li>
                    <li>Con acuerdo total o parcial: El acta debe ser presentada para su homologación ante el Juez de la causa (en derivación judicial). Si la mediación se inició por Avenimiento Prejudicial Obligatorio, la homologación del acuerdo depende del interés de las partes.</li>
                </ul>
            </div>
            <div class="mt-4 text-sm border-t pt-3">
                <i data-lucide="link" class="w-4 h-4 inline text-indigo-600"></i>
                <strong class="text-indigo-800">Normativa vigente del CEJUME:</strong>
                <a href="https://cejume.jusmisiones.gov.ar/index.php/organizacion/legislacion" target="_blank" class="text-indigo-600 underline break-all">https://cejume.jusmisiones.gov.ar/index.php/organizacion/legislacion</a>
            </div>
            <div class="text-xs text-slate-500">
                <i data-lucide="info" class="w-3 h-3 inline"></i> El Centro Judicial de Mediación funciona bajo supervisión del STJ, garantizando confidencialidad e imparcialidad.
            </div>
        </div>
    `;

    const etapasApoContent = `
        <div class="space-y-3">
            <div class="bg-white border border-indigo-200 rounded-xl p-4 shadow-sm">
                <h4 class="font-black text-indigo-800 flex gap-2 items-center text-lg mb-3">
                    <i data-lucide="git-pull-request" class="w-5 h-5"></i> Etapas del Avenimiento Prejudicial Obligatorio (APO)
                </h4>
                <ol class="list-decimal list-inside space-y-2 text-sm text-slate-700 ml-2">
                    <li><strong>Presentación del formulario 1A o derivación judicial:</strong> El interesado (con o sin patrocinio) o el Juzgado presenta la solicitud en la mesa de entradas del CEJUME o por correo electrónico.</li>
                    <li><strong>Sorteo y designación del mediador:</strong> El CEJUME asigna un mediador registrado, según el orden de sorteo y la competencia territorial.</li>
                    <li><strong>Citación a las partes:</strong> Se notifica a las partes la fecha, hora y lugar de la audiencia de mediación, con una antelación mínima de 5 días hábiles.</li>
                    <li><strong>Celebración de la audiencia:</strong> El mediador explica el procedimiento, escucha a las partes y facilita el diálogo. Puede realizarse en una o más sesiones.</li>
                    <li><strong>Resultado de la mediación:</strong>
                        <ul class="list-disc list-inside ml-6 mt-1 space-y-1">
                            <li><strong>Acuerdo total o parcial:</strong> Se labra acta con los términos del acuerdo. Las partes pueden solicitar la homologación judicial.</li>
                            <li><strong>Falta de acuerdo:</strong> Se labra acta de cierre, dejando constancia de la imposibilidad de acuerdo. El interesado puede iniciar la vía judicial correspondiente.</li>
                        </ul>
                    </li>
                    <li><strong>Archivo de las actuaciones:</strong> Una vez finalizada la mediación, el CEJUME archiva las actuaciones, garantizando la confidencialidad del proceso.</li>
                </ol>
                <p class="text-xs text-slate-500 mt-3"><i data-lucide="info" class="w-3 h-3 inline"></i> El procedimiento de Avenimiento Prejudicial Obligatorio (APO) debe cumplirse antes de iniciar ciertos juicios (ej. alimentos, divorcio, etc.).</p>
            </div>
        </div>
    `;

    const vigenciaForm7BContent = `
        <div class="space-y-3">

                <h4 class="font-black text-green-800 flex gap-2 items-center text-lg mb-3">
                    <i data-lucide="file-check" class="w-5 h-5"></i> Formulario 7-B CEJUME: vigencia ilimitada
                </h4>
                <p class="text-sm text-slate-700">El <strong>Formulario 7-B del Centro Judicial de Mediación (CEJUME) de Misiones</strong> no tiene vencimiento. Este documento certifica la finalización de un proceso de mediación por desistimiento de las partes (también aplica a los formularios 7-C y 7-D).</p>
                <ul class="step-list mt-3 text-sm">

                    <li><strong>Solicitud actual:</strong> Para obtener estos formularios de finalización, se solicitan vía correo electrónico a la dirección oficial del CEJUME: <a href="mailto:meu.cejume@jusmisiones.gov.ar" class="text-indigo-600 underline">meu.cejume@jusmisiones.gov.ar</a></li>
                </ul>
                <p class="text-xs text-slate-500 mt-3"><i data-lucide="info" class="w-3 h-3 inline"></i> Información proporcionada por el CEJUME Misiones. Ante cualquier duda, consultar con el Centro Judicial de Mediación.</p>
            </div>
        </div>
    `;

    function buildAlimentosDetailedContent() {
        return `

    function buildViolenciaFamiliarDetailedContent() {
        return `
            <div class="space-y-5">
                <div class="bg-gradient-to-r from-rose-50 to-red-50 rounded-xl p-5 border-l-8 border-red-700 shadow-sm">
                    <h3 class="text-xl font-black text-red-800 flex items-center gap-3"><i data-lucide="shield-alert" class="w-6 h-6"></i> Violencia Familiar (Ley Provincial XIV-6)</h3>
                    <p class="text-sm text-slate-700 mt-1">Arts. 655-658 CPC · Ley XIV-6 · Ley Orgánica IV-N.15 arts.113,118</p>
                    <div class="mt-3 warning-banner text-xs font-semibold text-red-800"><i data-lucide="users" class="w-3 h-3 inline mr-1"></i> Actuación del Defensor como patrocinante de la parte denunciante o denunciada</div>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-ordered" class="w-5 h-5 text-red-600"></i> Pasos operativos para la Defensoría Oficial</h4>
                    <ol class="ordered-step-list text-slate-700 text-sm space-y-4">
                        <li><strong class="text-red-800">DEUT envía legajo para intervención de la Defensoría</strong><br>Incluye oficio de derivación y documentación de la persona (denunciante o denunciada).</li>
                        <li><strong class="text-red-800">Operador asigna el legajo DEUT</strong><br>Se asigna al empleado para la primera entrevista con la persona, identificando su rol (denunciante o denunciado).</li>
                        <li><strong class="text-red-800">Entrevista y redacción del escrito para asumir el patrocinio</strong><br>El empleado, con la información brindada por la persona y la documental del legajo DEUT, redacta el escrito para asumir el patrocinio del denunciante o del denunciado (en la mayoría de los casos). Se deja constancia del vínculo, la situación fáctica y la voluntad de ser patrocinado por la Defensoría.</li>
                        <li><strong class="text-red-800">Actuación específica según la parte patrocinada</strong>
                            <div class="mt-2 pl-4 border-l-2 border-red-300 space-y-2">
                                <div><span class="font-extrabold text-red-700">🔹 Denunciante:</span> Redacción del escrito de inicio o ampliación. Se mencionan los hechos de violencia y el estado actual con el denunciado. Se solicita <strong>medidas de resguardo</strong> (exclusión del hogar, prohibición de acercamiento, reintegro, etc.) y <strong>oficios a organismos de aplicación</strong>: Ministerios (desarrollo social, salud), Centros de Salud Mental, Centro de Prevención de Adicciones, etc. Se ofrece prueba documental, informes médicos y testigos.</div>
                                <div><span class="font-extrabold text-red-700">🔸 Denunciado:</span> Redacción del escrito de defensa. Se mencionan los hechos que invoca en su defensa, se solicita <strong>medidas de resguardo</strong> a su favor (si correspondiere) y se adjunta <strong>terapia psicológica</strong> o constancias de tratamiento, como también cualquier elemento que desvirtúe o matice la denuncia. Se ofrecen pruebas (testigos, periciales) y se pide el debido proceso.</div>
                            </div>
                        </li>
                        <li><strong class="text-red-800">Solicitar vinculación en SIGED (caso de denunciados)</strong><br>En caso de tener acceso al expediente de Violencia Familiar, se debe solicitar la vinculación en SIGED. La solicitud de vinculación se envía al <strong>Juzgado de Violencia Familiar</strong> que interviene en la denuncia. Una vez vinculado el expediente en SIGED, se podrá leer la denuncia y los hechos circunstanciados denunciados, lo que permite una mejor defensa técnica.</li>
                        <li><strong class="text-red-800">Seguimiento de la resolución y providencias</strong><br>Se debe seguir el estado de resolución y las providencias del Juzgado de Violencia Familiar (o Juzgado de Familia con competencia en violencia familiar). Controlar plazos, presentar alegatos, oficios, y estar atento a las audiencias que fije el tribunal.</li>
                        <li><strong class="text-red-800">Archivo del expediente</strong><br>Cuando la denunciante no denuncia nuevos hechos de violencia y transcurren <strong>2 años</strong> sin incidentes, se puede solicitar el archivo de las actuaciones, previa constancia en autos y notificación a las partes. En caso de haber cesado la situación de riesgo, se labra el acta correspondiente.</li>
                        <li><strong class="text-red-800">Precauciones finales y cierre</strong><br>En ambos roles, la Defensoría debe mantener comunicación fluida con su patrocinado, informar sobre las resoluciones y garantizar el acceso a la justicia. En caso de revictimización o nuevos hechos, se debe reactivar el proceso.</li>
                    </ol>
                    <div class="mt-5 bg-red-50 p-4 rounded-lg border-l-4 border-red-500 text-xs">
                        <i data-lucide="gavel" class="w-3 h-3 inline text-red-700"></i> <strong class="text-red-800">Normativa destacada:</strong> Ley Provincial XIV-6 (Protección Integral contra la Violencia Familiar), arts. 655 a 658 CPC. La intervención del Defensor Oficial se rige por la Ley Orgánica IV-N.15 y debe respetar la ética profesional y la perspectiva de género.
                    </div>
                </div>
            </div>
        `;
    }

    function buildDefensorAusentesDetailedContent() {
        return `
            <div class="space-y-5">
                <div class="bg-gradient-to-r from-slate-100 to-gray-100 rounded-xl p-5 border-l-8 border-gray-700 shadow-sm">
                    <h3 class="text-xl font-black text-gray-800 flex items-center gap-3"><i data-lucide="help-circle" class="w-6 h-6"></i> Defensor de Ausentes</h3>
                    <p class="text-sm text-slate-600 mt-1">Arts. 344, 521, 560, 805 CPC (Ley XII-27) · Ley Orgánica IV-N.15 arts. 113, 114, 118</p>
                    <div class="mt-3 bg-gray-200/50 p-2 rounded-md text-xs font-mono text-gray-700">Procedimiento especial para representación de personas inciertas o ausentes</div>
                </div>
                <div class="red-warning flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <span><strong class="text-red-800">IMPORTANTE:</strong> No se puede asumir la defensa del ausente si se comprueba fehacientemente el <strong class="text-red-800">fallecimiento del ausente</strong>. En tal caso, debe informarse al Juzgado para que se designe a los herederos o un curador de la herencia yacente.</span>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-ordered" class="w-5 h-5 text-gray-700"></i> Pasos para el empleado de la Defensoría (análisis y decisión)</h4>
                    <ol class="ordered-step-list text-slate-700 text-sm space-y-4">
                        <li><strong class="text-gray-800">Recepción del expediente por Mesa de Entradas de la Defensoría</strong><br>El expediente proviene del Juzgado de origen (generalmente Juzgados Civiles, Comerciales o Laborales), donde se ha ordenado la designación de un defensor para persona incierta o ausente (art. 344 CPC). Mesa de Entradas registra el ingreso y lo asigna al área correspondiente.</li>
                        <li><strong class="text-gray-800">Asignación interna por el operador de la Defensoría</strong><br>El operador designa a un empleado/a abogado para que realice el análisis preliminar del caso, verificando la documentación y los motivos de la solicitud judicial.</li>
                        <li><strong class="text-gray-800">Verificación de los presupuestos legales (arts. 344, 521, 560 CPC)</strong><br>El empleado debe comprobar:<br>
                            - Que efectivamente se trate de una persona ausente con domicilio ignorado o incierto, o que no pueda comparecer por sí misma (art. 344).<br>
                            - Que la designación se haya solicitado en un proceso en el que sea necesaria la representación (ejecución, sucesión, etc.).<br>
                            - Que no exista ya un representante voluntario o legal designado (art. 560).<br>
                            <span class="text-red-700 font-semibold">- Que no se haya acreditado el fallecimiento de la persona ausente.</span>
                        </li>
                        <li><strong class="text-gray-800">Análisis de competencia y deber de asumir (Ley Orgánica IV-N.15 arts. 113, 114, 118)</strong><br>Conforme al art. 113 de la Ley Orgánica, la Defensoría Oficial tiene la función indelegable de representar a ausentes e incapaces cuando así lo ordene el tribunal. El empleado debe evaluar:<br>
                            - Si el caso encuadra en las competencias materiales de la Defensoría (art. 113 incs.).<br>
                            - Si existe algún impedimento o excusación válida (art. 114: parentesco, interés personal, amistad íntima, etc.).<br>
                            - Si la designación se ajusta a la distribución interna de trabajo.
                        </li>
                        <li><strong class="text-gray-800">Decisión motivada: asumir o declinar el cargo</strong><br>
                            <span class="font-semibold">✅ Si corresponde asumir:</span> El empleado redacta el escrito de aceptación del cargo, con fundamento en los arts. 805 CPC y 113 Ley Orgánica, y lo presenta ante el Juzgado de origen. Se solicita tener por designado al Defensor Oficial y se notifica el expediente para comenzar la actuación.<br>
                            <span class="font-semibold">❌ Si no corresponde:</span> Se elabora un informe dirigido al Juzgado, explicando las causales. <strong class="text-red-700">En particular, si se comprueba el fallecimiento del ausente, no se puede asumir la defensa</strong> (debe informarse al Juzgado para que se declare la herencia yacente o se cite a los herederos).
                        </li>
                        <li><strong class="text-gray-800">Una vez aceptado el cargo: actuación conforme al art. 805 CPC</strong><br>El Defensor Oficial debe:<br>
                            - Tomar conocimiento del proceso, revisando todas las actuaciones.<br>
                            - Realizar todas las diligencias necesarias para la defensa de los derechos del ausente (contestar demandas, ofrecer pruebas, interponer recursos, etc.).<br>
                            - Mantener contacto con el Juzgado y las demás partes, actuando con la lealtad y buena fe propias del deber público.
                        </li>
                        <li><strong class="text-gray-800">Seguimiento y control de plazos procesales</strong><br>El empleado asignado debe llevar un registro de las providencias, notificaciones y audiencias, asegurando la continuidad de la representación. Se debe informar al superior jerárquico sobre el estado del expediente periódicamente (art. 118 Ley Orgánica).</li>
                        <li><strong class="text-gray-800">Finalización del cargo de defensor de ausentes</strong><br>El cargo cesa cuando:<br>
                            - El ausente comparece personalmente o designa apoderado (art. 805 CPC).<br>
                            - Se prueba que la persona tiene domicilio conocido o se presenta un representante voluntario.<br>
                            - El proceso principal finaliza por sentencia firme o archivo.<br>
                            - <strong class="text-red-700">Se acredita fehacientemente el fallecimiento del ausente</strong>, debiendo comunicarse al Juzgado a los fines pertinentes.<br>
                            El empleado debe solicitar al Juzgado que tenga por concluida la intervención de la Defensoría y, en su caso, rendir cuenta de su actuación si correspondiere.
                    </ol>
                    <div class="mt-5 bg-gray-100 p-4 rounded-lg border-l-4 border-gray-500 text-xs">
                        <i data-lucide="book-open" class="w-3 h-3 inline text-gray-700"></i> <strong class="text-gray-800">Normativa de referencia:</strong> Ley XII-27 (Código Procesal Civil y Comercial de Misiones), arts. 344, 521, 560, 805; Ley Orgánica del Ministerio Público de la Defensa IV-N.15, arts. 113, 114, 118. 
                    </div>
                </div>
            </div>
        `;
    }

    function buildSaludMentalDetailedContent() {
        return `
            <div class="space-y-5">
                <div class="bg-gradient-to-r from-teal-50 to-cyan-50 rounded-xl p-5 border-l-8 border-teal-700 shadow-sm">
                    <h3 class="text-xl font-black text-teal-800 flex items-center gap-3"><i data-lucide="brain" class="w-6 h-6"></i> Ley Nacional de Salud Mental N° 26.657</h3>
                    <p class="text-sm text-slate-600 mt-1">Derechos, internaciones, rol de la Defensoría Oficial y Órgano de Revisión</p>
                    <div class="mt-3 normativa-destacada inline-flex">Ley de orden público - Presunción de capacidad</div>
                </div>
                <div class="green-info">
                    <i data-lucide="scale" class="w-4 h-4 inline mr-2"></i> <strong>Principio rector:</strong> “Se debe partir de la presunción de capacidad de todas las personas” (art. 3). El diagnóstico en salud mental no autoriza a presumir riesgo de daño o incapacidad (art. 5).
                </div>
                <div class="bg-amber-50 border-l-8 border-amber-600 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-amber-800 flex items-center gap-2"><i data-lucide="hospital" class="w-5 h-5"></i> Protocolo de Evaluación e Internación – Defensoría Oficial</h4>
                    <ul class="step-list text-sm mt-2 space-y-2">
                        <li><strong>Para cualquier punto, se debe:</strong> Estudiar bien cada caso y ver si existen otras causas.</li>
                        <li><strong>Previo a asumir provisoriamente asistencia letrada:</strong> Una vez que la persona esté evaluada y/o internada, entrevistar.</li>
                        <li><strong>Para todos los casos (leves, graves o severos):</strong> Entrevistar en el domicilio.</li>
                        <li><strong>Si la persona está internada:</strong> Visitar al nosocomio denunciado.</li>
                        <li><strong>Si existen otras causas donde hay menores y ya se actúa como MPC, NO se debe asumir en ningún carácter.</strong></li>
                        <li><strong>Para cerrar o archivar la causa:</strong> La persona debe demostrar que está realizando el tratamiento correspondiente.</li>
                    </ul>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-checks" class="w-5 h-5 text-teal-600"></i> Rol de la Defensoría Oficial en la Ley de Salud Mental</h4>
                    <ul class="step-list text-sm space-y-2">
                        <li><strong>Designación de abogado defensor (art. 22):</strong> Toda persona internada involuntariamente tiene derecho a designar un abogado. Si no lo hace, <strong>el Estado debe proporcionarle uno desde el momento de la internación</strong>. El defensor puede oponerse a la internación y solicitar la externación en cualquier momento, con control irrestricto de las actuaciones.</li>
                        <li><strong>Órgano de Revisión (arts. 38 a 40):</strong> Creado en el ámbito del <strong>Ministerio Público de la Defensa</strong>. Tiene funciones de supervisión de internaciones, control de derivaciones, y puede apelar decisiones judiciales. La Defensoría Oficial participa en su integración multidisciplinaria.</li>
                        <li><strong>Representación de personas con padecimiento mental:</strong> La Defensoría debe garantizar el acceso a la justicia, promoviendo medidas menos restrictivas, el consentimiento informado y la desmanicomialización.</li>
                    </ul>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="hospital" class="w-5 h-5 text-teal-600"></i> Internaciones: voluntarias e involuntarias</h4>
                    <p class="text-sm font-semibold mt-2">Internación voluntaria (arts. 16 a 18)</p>
                    <ul class="step-list text-sm pl-4">
                        <li>Requiere consentimiento informado en estado de lucidez.</li>
                        <li>Si se prolonga más de 60 días corridos, el equipo de salud debe comunicarlo al Órgano de Revisión y al juez para evaluar si continúa siendo voluntaria.</li>
                        <li>La persona puede abandonarla en cualquier momento.</li>
                    </ul>
                    <p class="text-sm font-semibold mt-3">Internación involuntaria (arts. 20 a 25)</p>
                    <ul class="step-list text-sm pl-4">
                        <li><strong>Recurso excepcional:</strong> Solo cuando no sean posibles abordajes ambulatorios y exista riesgo cierto e inminente para sí o terceros.</li>
                        <li>Debe estar fundada por dictamen de dos profesionales (uno psicólogo o psiquiatra).</li>
                        <li>Notificación al juez competente y al Órgano de Revisión en <strong>10 horas</strong>. El juez debe resolver en 3 días.</li>
                        <li>El juez solicita informes cada 30 días. A los 90 días, si continúa la internación, se requiere evaluación por un equipo independiente designado por el Órgano de Revisión.</li>
                        <li>El alta y externación son facultad del equipo de salud, sin necesidad de autorización judicial (art. 23).</li>
                    </ul>
                    <div class="mt-3 bg-red-50 p-3 rounded-lg text-xs">
                        <i data-lucide="alert-triangle" class="w-3 h-3 inline text-red-600"></i> <strong>Prohibición de manicomios:</strong> No se pueden crear nuevos manicomios o instituciones monovalentes. Los existentes deben adaptarse hasta su sustitución definitiva (art. 27). Las internaciones deben realizarse en hospitales generales (art. 28).
                    </div>
                </div>
                <div class="bg-indigo-50 rounded-xl p-4 text-sm">
                    <i data-lucide="gavel" class="w-4 h-4 inline mr-1 text-indigo-700"></i> <strong>Actuación concreta para el empleado de la Defensoría (integrando protocolo):</strong>
                    <ol class="ordered-step-list mt-2 text-xs space-y-1">
                        <li>Al recibir una notificación de internación involuntaria, verificar que se hayan cumplido los plazos de 10 horas (notificación) y 48 horas (documentación completa).</li>
                        <li>Constituirse como defensor del paciente (art. 22) si no lo ha designado particular. Entrevistar al internado en el nosocomio (protocolo) y evaluar su voluntad.</li>
                        <li>Si correspondiere, solicitar la externación inmediata al juez, o bien requerir un peritaje independiente al Órgano de Revisión (art. 24).</li>
                        <li>Supervisar que la internación no se prolongue por causas sociales o de vivienda (art. 15).</li>
                        <li>En caso de irregularidades (falta de consentimiento, condiciones indignas), efectuar denuncia ante el Órgano de Revisión y el juez, y eventualmente apelar (art. 40 incs. c, f).</li>
                        <li>Para el cierre o archivo de la causa, exigir que la persona demuestre que está realizando el tratamiento correspondiente.</li>
                    </ol>
                </div>
                <div class="text-xs text-slate-500 border-t pt-3">
                    <i data-lucide="link" class="w-3 h-3 inline"></i> <strong>Normativa:</strong> Ley Nacional N° 26.657 (publicada B.O. 3/12/2010). Reglamentada por Decreto 603/2013. Protocolo interno Defensoría Nº 6.
                </div>
            </div>
        `;
    }

    function buildArticulo32DetailedContent() {
        return `
            <div class="space-y-5">
                <div class="bg-gradient-to-r from-teal-50 to-cyan-50 rounded-xl p-5 border-l-8 border-teal-700 shadow-sm">
                    <h3 class="text-xl font-black text-teal-800 flex items-center gap-3"><i data-lucide="brain" class="w-6 h-6"></i> Artículo 32 CCC - Persona con capacidad restringida y con incapacidad</h3>
                    <p class="text-sm text-slate-600 mt-1">Código Civil y Comercial de la Nación · Ley 26.994</p>
                    <div class="mt-3 normativa-destacada inline-flex">Principio de autonomía progresiva · Apoyos · Subsidiariedad de la incapacidad</div>
                </div>
                <div class="bg-white border border-teal-200 rounded-xl p-4 shadow-sm">
                    <h4 class="font-black text-teal-800 flex items-center gap-2"><i data-lucide="file-text" class="w-5 h-5"></i> Texto del artículo 32 del Código Civil y Comercial</h4>
                    <div class="mt-2 p-3 bg-teal-50 rounded-lg font-mono text-sm text-slate-800">
                        <p><strong>ARTÍCULO 32.</strong> <em>Persona con capacidad restringida y con incapacidad.</em> El juez puede restringir la capacidad para determinados actos de una persona mayor de trece años que padece una adicción o una alteración mental permanente o prolongada, de suficiente gravedad, siempre que estime que del ejercicio de su plena capacidad puede resultar un daño a su persona o a sus bienes.</p>
                        <p class="mt-2">En relación con dichos actos, el juez debe designar el o los apoyos necesarios que prevé el artículo 43, especificando las funciones con los ajustes razonables en función de las necesidades y circunstancias de la persona. El o los apoyos designados deben promover la autonomía y favorecer las decisiones que respondan a las preferencias de la persona protegida.</p>
                        <p class="mt-2">Por excepción, cuando la persona se encuentre absolutamente imposibilitada de interaccionar con su entorno y expresar su voluntad por cualquier modo, medio o formato adecuado y el sistema de apoyos resulte ineficaz, el juez puede declarar la incapacidad y designar un curador.</p>
                    </div>
                </div>
                <div class="bg-amber-50 border-l-8 border-amber-600 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-amber-800 flex items-center gap-2"><i data-lucide="clipboard-list" class="w-5 h-5"></i> Protocolo para Determinación de Capacidad – Defensoría Oficial N.º 6</h4>
                    <p class="text-sm mt-1"><strong>Turnos:</strong> Abril – Agosto – Diciembre</p>
                    <ul class="step-list text-sm mt-3 space-y-2">
                        <li><strong>Si viene de JUZGADO DE INSTRUCCIÓN (penal):</strong> Actuar como <strong>MPC del incapaz</strong> (art. 103 inc. a CCC). Porque le declaran inimputable. Iniciar la acción como Ministerio Público del Incapaz y solicitar un <strong>Ministerio Público Principal</strong> para el seguimiento.</li>
                        <li><strong>Si viene de JUZGADO DE FAMILIA:</strong> Actuar como <strong>PMC del incapaz</strong> (Asesor de Incapaces), patrocinio y/o asistencia letrada de la persona a quien se pretende restringir la capacidad.</li>
                        <li><strong>Derivados por oficio DEUT para inicio de juicio de determinación de capacidad:</strong> Tener en cuenta los sistemas de apoyos. Realizar <strong>dos entrevistas</strong> con el grupo familiar y/o personas referentes afectivos. Considerar apoyos según art. 33 CCC: familiar directo o dentro del 4° grado, o personas con afinidad (propuesto por el defensor). Verificar si tiene otras causas para no actuar en varios caracteres.</li>
                        <li><strong>Para asumir PATROCINIO o asistencia letrada de la persona a quien se quiere determinar la capacidad:</strong>
                            <ul class="list-disc pl-6 mt-1 space-y-1">
                                <li>Estudiar bien cada caso y ver si existen otras causas.</li>
                                <li>Si las causas son iniciadas por otras defensorías, tratar de trabajar juntos para un mejor acceso a la justicia.</li>
                                <li>Previo a asumir provisoriamente asistencia letrada (si los tiempos no dan para entrevista), igualmente hacer la visita al domicilio para todos los casos (leves, graves o severos).</li>
                                <li>Si la persona está internada, visitar el nosocomio.</li>
                                <li><strong>Si existen otras causas donde hay menores y ya se actúa como MPC, NO se debe asumir en ningún carácter.</strong></li>
                                <li>Para las causas de determinación de capacidad, se revisan cada <strong>3 años</strong>.</li>
                                <li>Las causas que se elevan a Cámara son las que restringen totalmente la capacidad y/o cuando se apela algún punto del fallo.</li>
                            </ul>
                        </li>
                        <li><strong>Control de despachos:</strong> Llevar, revisar y/o controlar los despachos de cada causa. No dejar que se duerman.</li>
                    </ul>
                    <div class="mt-3 text-xs text-amber-700"><i data-lucide="info" class="w-3 h-3 inline"></i> Basado en protocolo interno Defensoría Nº 6 (entregado por la Procuración General).</div>
                </div>
                <div class="green-info text-xs">
                    <i data-lucide="scale" class="w-3 h-3 inline mr-1"></i> <strong>Principio rector:</strong> El ordenamiento jurídico argentino parte de la presunción de capacidad de todas las personas (art. 31 CCC). Las restricciones a la capacidad son excepcionales, temporales y deben ser revisadas periódicamente. El sistema de apoyos es la regla general, la curatela es la excepción.
                </div>
                <div class="text-xs text-slate-500 border-t pt-3">
                    <i data-lucide="link" class="w-3 h-3 inline"></i> <strong>Normativa de referencia:</strong> Ley 26.994 (Código Civil y Comercial de la Nación), arts. 31, 32, 36, 43, 103, 139; Convención de Naciones Unidas sobre los Derechos de las Personas con Discapacidad (Ley 26.378).
                </div>
            </div>
        `;
    }

    function buildProteccionAdultosContent() {

    function buildFiliacionDetailedContent() {

                    <p class="text-sm text-slate-600 mt-1">Ley Provincial XII-31 · Arts. 644 CPC · Ley Orgánica IV-N.15 arts.113,118</p>
                    <div class="mt-3 normativa-destacada inline-flex">Gratuidad automática para patrocinados por Defensoría Oficial (art. 3)</div>
                </div>
                <div class="green-info text-sm">
                    <i data-lucide="scale" class="w-4 h-4 inline mr-2"></i> <strong>Beneficio establecido por Ley XII-31:</strong> Las personas que carecen de medios económicos pueden obtener gratuitamente la pericial genética (ADN) en procesos de filiación. <strong>Quienes litigan con patrocinio o representación de la Defensoría Oficial acceden directamente al beneficio, sin necesidad de acreditar insolvencia (art. 3, párrafo 3°).</strong>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-steps" class="w-5 h-5 text-emerald-600"></i> Pasos que debe seguir el empleado de la Defensoría Oficial</h4>
                    <ol class="ordered-step-list text-slate-700 text-sm space-y-4">
                        <li><strong class="text-emerald-800">Recepción y asignación del legajo (DEUT o ingreso directo)</strong><br>El caso puede llegar derivado por el DEUT (con legajo y documentación) o por presentación espontánea del requirente. El operador asigna un empleado abogado para la entrevista inicial y análisis del vínculo familiar.</li>
                        <li><strong class="text-emerald-800">Entrevista y recolección de información</strong><br>El empleado entrevista al requirente, releva los datos filiatorios, la identidad del presunto padre/madre, y cualquier principio de prueba (cartas, testimonios, etc.). <strong class="text-emerald-700">No se requiere acreditar insolvencia económica por tratarse de patrocinio de la Defensoría Oficial (art. 3 ley XII-31).</strong> Se informa al cliente sobre el alcance de la acción y la prueba de ADN gratuita.</li>
                        <li><strong class="text-emerald-800">Redacción de la demanda de filiación</strong><br>Se redacta la demanda conforme a los arts. 644 y ss. CPC, solicitando:
                            <ul class="list-disc pl-6 mt-1 space-y-1">
                                <li>La declaración judicial de filiación (matrimonial o extramatrimonial).</li>
                                <li>La producción de la pericial genética (ADN) en el Instituto de Genética Humana (Parque de la Salud).</li>
                                <li>La gratuidad de la prueba con fundamento en el art. 3 de la Ley XII-31 (por litigar con patrocinio de la Defensoría Oficial).</li>
                                <li>Medidas cautelares si correspondiere (anotación de nacimiento, etc.).</li>
                            </ul>
                        </li>
                        <li><strong class="text-emerald-800">Presentación de la demanda y solicitud de oficio al Instituto de Genética</strong><br>El empleado presenta el escrito ante el Juzgado de Familia competente. Al mismo tiempo, solicita que se libre oficio al Instituto de Genética Humana (Parque de la Salud “Dr. Ramón Madariaga”) a fin de requerir presupuesto y fecha para la extracción de muestras (art. 5 Ley XII-31). El juez, al admitir la demanda, ordenará la pericia y oficiará al Instituto.</li>
                        <li><strong class="text-emerald-800">Seguimiento de la pericia genética</strong><br>El empleado debe:
                            <ul class="list-disc pl-6 mt-1 space-y-1">
                                <li>Notificar a su patrocinado la fecha, hora y lugar de la extracción.</li>
                                <li>Acompañar al requirente si es necesario, o coordinar con el Instituto.</li>
                                <li>Verificar que las muestras sean remitidas al laboratorio y se produzca el informe pericial.</li>
                            </ul>
                        </li>
                        <li><strong class="text-emerald-800">Actuación en el proceso hasta la sentencia</strong><br>Una vez agregado el peritaje, el empleado debe:
                            <ul class="list-disc pl-6 mt-1 space-y-1">
                                <li>Controlar el traslado a la parte demandada y contestar eventuales impugnaciones.</li>
                                <li>Solicitar la audiencia de prueba si correspondiere (testigos, documental).</li>
                                <li>Alegar sobre el resultado de la pericia y la procedencia de la acción.</li>
                            </ul>
                        </li>
                        <li><strong class="text-emerald-800">Sentencia definitiva y determinación de erogaciones (art. 9 Ley XII-31)</strong><br>Obtenida la sentencia favorable, el empleado debe <strong>solicitar que en el fallo se determine el monto de las erogaciones que implicó la realización de la prueba pericial</strong> (art. 9). Esto permite que, si hay condena en costas, el Estado (Parque de la Salud) pueda repetir contra el condenado al pago de las costas (art. 10).</li>
                        <li><strong class="text-emerald-800">Acción de repetición (si corresponde)</strong><br>Si la parte demandada es condenada en costas, el empleado puede colaborar con el Parque de la Salud en la eventual acción de repetición, aunque no es su función principal. En todo caso, debe informar al cliente y dejar constancia en autos.</li>
                        <li><strong class="text-emerald-800">Finalización y archivo</strong><br>Una vez firme la sentencia y cumplidas las cargas procesales, se solicita el archivo de las actuaciones. El empleado debe guardar copia del legajo y del peritaje para futuros trámites (por ejemplo, inscripción de nacimiento, rectificación de partida).</li>
                    </ol>
                    <div class="mt-5 bg-emerald-50 p-4 rounded-lg border-l-4 border-emerald-500 text-xs">
                        <i data-lucide="file-text" class="w-3 h-3 inline text-emerald-700"></i> <strong class="text-emerald-800">Normativa específica aplicable:</strong> Ley Provincial XII-31 (Gratuidad de la prueba de ADN en filiación). Especial atención al art. 3 (acceso directo para patrocinados por Defensoría Oficial), art. 5 (oficio al Instituto de Genética), art. 7 (resolución fundada del juez) y art. 9 (determinación de erogaciones en sentencia). Complementar con arts. 644 a 654 CPC (acciones de filiación).
                    </div>
                    <div class="mt-3 text-xs text-slate-500 italic">
                        📌 <strong>Recordatorio:</strong> La Defensoría Oficial asegura el acceso a la justicia de las personas en situación de vulnerabilidad. En filiación, la prueba de ADN gratuita es una herramienta fundamental para la identidad y el derecho a conocer el origen biológico.
                    </div>
                </div>
            </div>
        `;
    }

    function buildGuardaTutelaContent() {
        return `
            <div class="space-y-5">
                <div class="bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl p-5 border-l-8 border-amber-700 shadow-sm">
                    <h3 class="text-xl font-black text-amber-800 flex items-center gap-3"><i data-lucide="users" class="w-6 h-6"></i> Guarda y Tutela de Menores – Protocolo Defensoría</h3>
                    <p class="text-sm text-slate-600 mt-1">Procedimiento ante situaciones de vulnerabilidad de niños, niñas y adolescentes</p>
                    <div class="mt-3 normativa-destacada inline-flex">Arts. 4 Ley XIV-6 · Código Civil y Comercial · Responsabilidad parental</div>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-steps" class="w-5 h-5 text-amber-600"></i> Pasos del protocolo para otorgamiento de guarda o tutela</h4>
                    <ol class="ordered-step-list text-slate-700 text-sm space-y-4">
                        <li><strong class="text-amber-800">Padres fallecidos</strong><br>Se debe presentar el <strong>acta de defunción</strong> de ambos progenitores. Con este documento, se inicia el trámite de guarda o tutela a favor del pariente o persona idónea.</li>
                        <li><strong class="text-amber-800">Padres con problemas de salud grave</strong><br>Se requiere <strong>historia clínica y/o epicrisis</strong> que acredite la imposibilidad de los progenitores para ejercer la responsabilidad parental. El equipo interdisciplinario evaluará la situación.</li>
                        <li><strong class="text-amber-800">Violencia familiar con guarda provisoria</strong><br>Si existe denuncia de violencia y el <strong>Juez de Violencia Familiar</strong> otorgó la guarda provisoria (art. 4 Ley XIV-6), se tomará como base para avanzar en la guarda definitiva.</li>
                        <li><strong class="text-amber-800">Falta de cumplimiento de requisitos anteriores</strong><br>Cuando no se den los supuestos 1, 2 o 3, se debe <strong>fijar audiencia</strong> y citar a los padres del menor para que ellos otorguen la <strong>responsabilidad parental al pariente</strong> voluntariamente.</li>
                        <li><strong class="text-amber-800">Intervención del equipo interdisciplinario</strong><br>Solicitar que el <strong>Equipo Interdisciplinario de las Defensorías</strong> realice los informes correspondientes (estudio socioambiental, psicológico, etc.).</li>
                        <li><strong class="text-amber-800">Realización de trámites definitivos</strong><br>Una vez realizados todos los pasos previos, se procederá a los trámites que correspondan según la vía judicial (guarda judicial, tutela, o acuerdo de responsabilidad parental).</li>
                        <li><strong class="text-amber-800">Casos de oposición materna</strong><br>Si la madre se presenta solicitando patrocinio para que <strong>no se otorgue la guarda</strong>, se debe <strong>iniciar juicio de restitución inmediatamente</strong>, a fin de resguardar el interés superior del niño y el derecho de la madre.</li>
                    </ol>
                    <div class="mt-5 bg-amber-50 p-4 rounded-lg border-l-4 border-amber-500 text-xs">
                        <i data-lucide="scale" class="w-3 h-3 inline text-amber-700"></i> <strong class="text-amber-800">Fundamento:</strong> El protocolo prioriza el interés superior del niño, la excepcionalidad de la separación familiar y la búsqueda de soluciones consensuadas cuando sea posible. En caso de conflictos, se activan las vías judiciales pertinentes.
                    </div>
                </div>
            </div>
        `;
    }

            { key: 'pensionGraciableMenores', title: 'Pensión Graciable a Menores Víctimas (Ley XIX-51)', subtitle: 'Ley XIX-51; Ley IV-N.15 arts.113,118' }, 
            { key: 'proteccionPersonasMayores', title: 'Protección Integral Personas Mayores (Ley XIX-41)', subtitle: 'Ley XIX-41; Ley IV-N.15 arts.113,118' }, 
            { key: 'mediacionHomologacion', title: 'Mediación y Homologación de Acuerdos (Ley XII-19)', subtitle: 'Ley XII-19 arts. 15,28,34,35,36; Ley IV-N.15 arts.113,118' } 
        ] }
    ];

    let currentFilter = "";
    function renderAccordion(filterText = "") {
        const container = document.getElementById('accordion-container');
        if (!container) return;
        const filterLower = filterText.toLowerCase();
        const filteredMaterias = materias.map(materia => {
            const filteredProcesos = materia.procesos.filter(proc => proc.title.toLowerCase().includes(filterLower) || proc.subtitle.toLowerCase().includes(filterLower));
            return { ...materia, procesos: filteredProcesos };
        }).filter(materia => materia.procesos.length > 0);
        if (filteredMaterias.length === 0) {
            container.innerHTML = `<div class="p-6 text-center bg-white rounded-2xl text-slate-400">🔍 Ningún proceso coincide con "${filterText}"</div>`;
            return;
        }
        let html = '';
        filteredMaterias.forEach((materia, idx) => {
            const accordionId = `accordion-${materia.id}-${idx}`;
            const isOpen = false;
            html += `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="accordion-header flex justify-between items-center p-4 bg-slate-50 hover:bg-indigo-50 transition" data-target="${accordionId}">
                        <span class="font-extrabold text-indigo-800 text-sm tracking-wide">${materia.nombreCategoria}</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-600 rotate-icon ${isOpen ? 'open' : ''} transition-transform"></i>
                    </div>
                    <div id="${accordionId}" class="accordion-content ${isOpen ? 'open' : ''} border-t border-slate-100">
                        <div class="p-3 space-y-2 bg-white">
                            ${materia.procesos.map(proc => `
                                <div class="proceso-card w-full text-left p-3 rounded-xl hover:bg-indigo-50 transition-all shadow-sm border border-slate-100" data-proceso='${JSON.stringify({ title: proc.title, subtitle: proc.subtitle, especial: proc.contenidoEspecial || false, key: proc.key })}'>
                                    <span class="block font-bold text-slate-800">${proc.title}</span>
                                    <div class="normativa-destacada mt-1 text-xs"><i data-lucide="book-open" class="w-3 h-3 inline mr-1"></i> ${proc.subtitle}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', (e) => {
                const targetId = header.getAttribute('data-target');
                const contentDiv = document.getElementById(targetId);
                const icon = header.querySelector('.rotate-icon');
                if (contentDiv) {
                    contentDiv.classList.toggle('open');
                    if (icon) icon.classList.toggle('open');
                }
            });
        });
        document.querySelectorAll('.proceso-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const data = JSON.parse(card.getAttribute('data-proceso'));
                mostrarContenidoCentral(data);
            });
        });
    }
    
    function mostrarContenidoCentral(procesoData) {
        const area = document.getElementById('detail-content-area');
        if (!area) return;
        if (procesoData.especial && procesoData.key === 'cejume') {
            area.innerHTML = buildCentralCejumeWithAccordions();
            if (window.lucide) lucide.createIcons();
            document.querySelectorAll('.inner-accordion-header').forEach(header => {
                const targetId = header.getAttribute('data-inner-target');
                const targetDiv = document.getElementById(targetId);
                const chevron = header.querySelector('.rotate-chevron');
                header.addEventListener('click', () => {
                    if (targetDiv) {
                        targetDiv.classList.toggle('open');
                        if (chevron) chevron.classList.toggle('open');
                    }
                });
            });
        } 
        else if (procesoData.key === 'alimentos') {
            area.innerHTML = buildAlimentosDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'proteccionViolencia') {
            area.innerHTML = buildViolenciaFamiliarDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'ausentes') {
            area.innerHTML = buildDefensorAusentesDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'saludMental') {
            area.innerHTML = buildSaludMentalDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'articulo32') {
            area.innerHTML = buildArticulo32DetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'filiacion') {
            area.innerHTML = buildFiliacionDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'guardaTutela') {
            area.innerHTML = buildGuardaTutelaContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'proteccionAdultos') {
            area.innerHTML = buildProteccionAdultosContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.title) {
            area.innerHTML = placeholderContent(procesoData.title, procesoData.subtitle);
            if (window.lucide) lucide.createIcons();
        } else {
            area.innerHTML = emptyStateMessage;
            if (window.lucide) lucide.createIcons();
        }
    }
    
    function resetAndShowDefault() {
        currentFilter = "";
        const searchInput = document.getElementById('searchProceso');
        if (searchInput) searchInput.value = '';
        renderAccordion('');
        const area = document.getElementById('detail-content-area');
        if (area) {
            area.innerHTML = emptyStateMessage;
            if (window.lucide) lucide.createIcons();
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        resetAndShowDefault();
        const searchInput = document.getElementById('searchProceso');
        if (searchInput) searchInput.addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderAccordion(currentFilter);
        });
        const resetBtn = document.getElementById('resetAppButton');
        if (resetBtn) resetBtn.addEventListener('click', resetAndShowDefault);
        if (window.lucide) lucide.createIcons();
    });
</script>
</body>
</html>
