<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Defensoría Oficial - Guía de Actuación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .legal-code { font-family: 'Roboto Mono', monospace; }
        .circles-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding-top: 2rem;
        }
        .circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }
        .circle:hover { transform: scale(1.05); }
        .circle-red { background-color: #dc2626; }
        .circle-orange { background-color: #f97316; }
        .circle-green { background-color: #10b981; }
        .proceso-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            background: white;
        }
        .proceso-card:hover {
            transform: translateX(4px);
            border-left-color: #4f46e5;
            background-color: #fefce8;
            box-shadow: 0 4px 10px -4px rgba(0,0,0,0.05);
        }
        .accordion-header {
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .accordion-header:hover {
            background-color: #eef2ff;
        }
        .normativa-destacada {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 1rem;
            border-left: 3px solid #f59e0b;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 80px 380px 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 70px 320px 1fr;
            }
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .circles-panel {
                flex-direction: row;
                justify-content: center;
                padding-top: 0;
            }
        }
        .central-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .inner-accordion-item {
            border-bottom: 1px solid #e2e8f0;
        }
        .inner-accordion-header {
            cursor: pointer;
            padding: 1rem 1.25rem;
            background-color: #faf9fe;
            transition: background 0.2s;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .inner-accordion-header:hover {
            background-color: #f1f0ff;
        }
        .inner-accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: white;
        }
        .inner-accordion-content.open {
            max-height: 1200px;
            transition: max-height 0.45s ease-in;
        }
        .rotate-chevron {
            transition: transform 0.2s ease;
        }
        .rotate-chevron.open {
            transform: rotate(180deg);
        }
        .step-list {
            list-style: none;
            padding-left: 0;
        }
        .step-list li {
            margin-bottom: 0.75rem;
            padding-left: 1.5rem;
            position: relative;
        }
        .step-list li::before {
            content: "•";
            color: #4f46e5;
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0;
            top: -2px;
        }
        .ordered-step-list {
            list-style: none;
            padding-left: 0;
            counter-reset: step-counter;
        }
        .ordered-step-list li {
            counter-increment: step-counter;
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
        }
        .ordered-step-list li::before {
            content: counter(step-counter) ".";
            color: #4f46e5;
            font-weight: 800;
            font-size: 0.9rem;
            position: absolute;
            left: 0;
            top: 0;
        }
        .table-themes {
            background: #f8fafc;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #e0e7ff;
        }
        .badge-theme {
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-content.open {
            max-height: 800px;
            transition: max-height 0.4s ease-in;
        }
        .rotate-icon {
            transition: transform 0.2s ease;
        }
        .rotate-icon.open {
            transform: rotate(180deg);
        }
        .warning-banner {
            background: #fee2e2;
            border-left: 6px solid #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

<header class="bg-indigo-950 text-white border-b-4 border-amber-500 no-print relative z-10 shadow-md">

        <div class="flex items-center gap-3 flex-wrap">
            <div class="relative header-search min-w-[240px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchProceso" placeholder="Buscar proceso o norma..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-800 shadow-sm">
            </div>
            <span class="bg-amber-500 text-indigo-950 px-3 py-1 rounded font-black text-xs whitespace-nowrap">BUSCAR EN EL LISTADO</span>

</header>

<div class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">

            <div class="p-5 md:p-7" id="detail-content-area"></div>

    </div>
</div>

<script>

                    <li><strong>Área Legal:</strong> Evaluación de solicitudes, evacuación de trámites simples, conexión informática con Juzgados de Familia, fijación de audiencias, confección de escritos y oficios, y derivación del caso a la Defensoría que corresponda.</li>

                <ul class="step-list mt-2 text-sm">
                    <li><strong>Paso 1:</strong> El requirente concurre al DEUT (lunes a viernes de 7 a 12 hs). Se le entrega un instructivo con los requisitos según su pretensión.</li>

    const formularioCejumeContent = `

    const cejumeMediacionContent = `

    const etapasApoContent = `

                        </ul>
                    </li>

    // Contenido específico para Violencia Familiar (con el nuevo paso de SIGED para denunciados)
    function buildViolenciaFamiliarDetailedContent() {

                    <h3 class="text-xl font-black text-red-800 flex items-center gap-3"><i data-lucide="shield-alert" class="w-6 h-6"></i> Violencia Familiar (Ley Provincial XIV-6)</h3>
                    <p class="text-sm text-slate-700 mt-1">Arts. 655-658 CPC · Ley XIV-6 · Ley Orgánica IV-N.15 arts.113,118</p>
                    <div class="mt-3 warning-banner text-xs font-semibold text-red-800"><i data-lucide="users" class="w-3 h-3 inline mr-1"></i> Actuación del Defensor como patrocinante de la parte denunciante o denunciada</div>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h4 class="font-black text-slate-800 flex items-center gap-2 text-lg mb-4"><i data-lucide="list-ordered" class="w-5 h-5 text-red-600"></i> Pasos operativos para la Defensoría Oficial</h4>
                    <ol class="ordered-step-list text-slate-700 text-sm space-y-4">
                        <li><strong class="text-red-800">DEUT envía legajo para intervención de la Defensoría</strong><br>Incluye oficio de derivación y documentación de la persona (denunciante o denunciada).</li>
                        <li><strong class="text-red-800">Operador asigna el legajo DEUT</strong><br>Se asigna al empleado para la primera entrevista con la persona, identificando su rol (denunciante o denunciado).</li>
                        <li><strong class="text-red-800">Entrevista y redacción del escrito para asumir el patrocinio</strong><br>El empleado, con la información brindada por la persona y la documental del legajo DEUT, redacta el escrito para asumir el patrocinio del denunciante o del denunciado (en la mayoría de los casos). Se deja constancia del vínculo, la situación fáctica y la voluntad de ser patrocinado por la Defensoría.</li>
                        <li><strong class="text-red-800">Actuación específica según la parte patrocinada</strong>
                            <div class="mt-2 pl-4 border-l-2 border-red-300 space-y-2">
                                <div><span class="font-extrabold text-red-700">🔹 Denunciante:</span> Redacción del escrito de inicio o ampliación. Se mencionan los hechos de violencia y el estado actual con el denunciado. Se solicita <strong>medidas de resguardo</strong> (exclusión del hogar, prohibición de acercamiento, reintegro, etc.) y <strong>oficios a organismos de aplicación</strong>: Ministerios (desarrollo social, salud), Centros de Salud Mental, Centro de Prevención de Adicciones, etc. Se ofrece prueba documental, informes médicos y testigos.</div>
                                <div><span class="font-extrabold text-red-700">🔸 Denunciado:</span> Redacción del escrito de defensa. Se mencionan los hechos que invoca en su defensa, se solicita <strong>medidas de resguardo</strong> a su favor (si correspondiere) y se adjunta <strong>terapia psicológica</strong> o constancias de tratamiento, como también cualquier elemento que desvirtúe o matice la denuncia. Se ofrecen pruebas (testigos, periciales) y se pide el debido proceso.</div>
                            </div>
                        </li>
                        <li><strong class="text-red-800">Solicitar vinculación en SIGED (caso de denunciados)</strong><br>En caso de tener acceso al expediente de Violencia Familiar, se debe solicitar la vinculación en SIGED. La solicitud de vinculación se envía al <strong>Juzgado de Violencia Familiar</strong> que interviene en la denuncia. Una vez vinculado el expediente en SIGED, se podrá leer la denuncia y los hechos circunstanciados denunciados, lo que permite una mejor defensa técnica.</li>
                        <li><strong class="text-red-800">Seguimiento de la resolución y providencias</strong><br>Se debe seguir el estado de resolución y las providencias del Juzgado de Violencia Familiar (o Juzgado de Familia con competencia en violencia familiar). Controlar plazos, presentar alegatos, oficios, y estar atento a las audiencias que fije el tribunal.</li>
                        <li><strong class="text-red-800">Archivo del expediente</strong><br>Cuando la denunciante no denuncia nuevos hechos de violencia y transcurren <strong>2 años</strong> sin incidentes, se puede solicitar el archivo de las actuaciones, previa constancia en autos y notificación a las partes. En caso de haber cesado la situación de riesgo, se labra el acta correspondiente.</li>
                        <li><strong class="text-red-800">Precauciones finales y cierre</strong><br>En ambos roles, la Defensoría debe mantener comunicación fluida con su patrocinado, informar sobre las resoluciones y garantizar el acceso a la justicia. En caso de revictimización o nuevos hechos, se debe reactivar el proceso.</li>
                    </ol>
                    <div class="mt-5 bg-red-50 p-4 rounded-lg border-l-4 border-red-500 text-xs">
                        <i data-lucide="gavel" class="w-3 h-3 inline text-red-700"></i> <strong class="text-red-800">Normativa destacada:</strong> Ley Provincial XIV-6 (Protección Integral contra la Violencia Familiar), arts. 655 a 658 CPC. La intervención del Defensor Oficial se rige por la Ley Orgánica IV-N.15 y debe respetar la ética profesional y la perspectiva de género.
                    </div>
                </div>
            </div>
        `;
    }

    function buildCentralCejumeWithAccordions() {
        return `
            <div class="inner-accordion-item">
                <div class="inner-accordion-header" data-inner-target="inner-1">
                    <span class="flex items-center gap-2"><i data-lucide="building-2" class="w-5 h-5 text-indigo-600"></i> 1. Oficina DEUT: Departamento de Entrada Única de Trámites</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-500 rotate-chevron" id="chevron-1"></i>
                </div>
                <div id="inner-1" class="inner-accordion-content"><div class="p-5 pt-2">${oficinaDeutContent}</div></div>
            </div>
            <div class="inner-accordion-item">
                <div class="inner-accordion-header" data-inner-target="inner-2">
                    <span class="flex items-center gap-2"><i data-lucide="file-edit" class="w-5 h-5 text-indigo-600"></i> 2. Formulario CEJUME (1A, APO, derivación)</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-500 rotate-chevron" id="chevron-2"></i>
                </div>
                <div id="inner-2" class="inner-accordion-content"><div class="p-5 pt-2">${formularioCejumeContent}</div></div>
            </div>
            <div class="inner-accordion-item">
                <div class="inner-accordion-header" data-inner-target="inner-3">
                    <span class="flex items-center gap-2"><i data-lucide="gavel" class="w-5 h-5 text-indigo-600"></i> 3. CEJUME - Centro Judicial de Mediación (etapa prejudicial)</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-500 rotate-chevron" id="chevron-3"></i>
                </div>
                <div id="inner-3" class="inner-accordion-content"><div class="p-5 pt-2">${cejumeMediacionContent}</div></div>
            </div>
            <div class="inner-accordion-item">
                <div class="inner-accordion-header" data-inner-target="inner-4">
                    <span class="flex items-center gap-2"><i data-lucide="git-pull-request" class="w-5 h-5 text-indigo-600"></i> 4. Etapas del proceso CEJUME (Avenimiento Prejudicial Obligatorio)</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-500 rotate-chevron" id="chevron-4"></i>
                </div>
                <div id="inner-4" class="inner-accordion-content"><div class="p-5 pt-2">${etapasApoContent}</div></div>
            </div>
            <div class="inner-accordion-item">
                <div class="inner-accordion-header" data-inner-target="inner-5">
                    <span class="flex items-center gap-2"><i data-lucide="file-check" class="w-5 h-5 text-green-600"></i> 5. Vigencia Formulario 7B CEJUME</span>
                    <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-500 rotate-chevron" id="chevron-5"></i>
                </div>
                <div id="inner-5" class="inner-accordion-content"><div class="p-5 pt-2">${vigenciaForm7BContent}</div></div>
            </div>
        `;
    }

    const placeholderContent = (title, normativa) => `
        <div class="text-center py-10 px-4">
            <i data-lucide="file-code" class="w-14 h-14 mx-auto text-slate-300 mb-3"></i>
            <h3 class="text-xl font-bold text-slate-600">${title}</h3>
            <div class="normativa-destacada mt-2 mx-auto inline-block">${normativa}</div>
            <p class="mt-5 text-slate-500">📋 Próximamente: pasos a seguir detallados para este proceso.</p>
            <p class="text-sm text-slate-400">Consulte normativa vigente y jurisprudencia aplicable.</p>
        </div>
    `;

    const emptyStateMessage = `
        <div class="flex flex-col items-center justify-center text-center p-8 md:p-12 border-2 border-blue-300 rounded-xl bg-blue-50/30 shadow-sm min-h-[300px]">
            <i data-lucide="search" class="w-12 h-12 text-blue-500 mb-4"></i>
            <p class="text-blue-800 font-medium text-lg">Use el filtro de búsqueda o pulse sobre el proceso</p>
            <p class="text-blue-600 text-sm mt-2">para ingresar al contenido de pasos de actuación.</p>
        </div>
    `;

    // MATERIAS: se agrega "PROCESOS DE VIOLENCIA FAMILIAR"
    const materias = [
        { nombreCategoria: "⚖️ ETAPA PREJUDICIAL", id: "prejudicial", procesos: [ { key: "cejume", title: "(DEUT - CEJUME) - Instancia Prejudicial Obligatoria", subtitle: "Avenimiento Prejudicial Obligatorio (APO) | Leyes XII-19, IV-N.15", contenidoEspecial: true } ] },
        { nombreCategoria: "⚖️ PROCESOS DE FAMILIA", id: "familia", procesos: [ { key: 'alimentos', title: 'Alimentos y Litisexpensas', subtitle: 'Arts. 696-710 CPC; Ley IV-N.15 arts.113,118' }, { key: 'ejecucionAlimentos', title: 'Ejecución de Alimentos', subtitle: 'Arts. 704,707 CPC; Ley IV-N.15 art.118' }, { key: 'incapacidad', title: 'Declaración de Incapacidad', subtitle: 'Arts. 659-673 CPC; Ley IV-N.15 arts.113,118' }, { key: 'inhabilitacion', title: 'Declaración de Inhabilitación', subtitle: 'Arts. 674-678 CPC; Ley IV-N.15 arts.113,118' }, { key: 'restitucionMenores', title: 'Restitución de Menores', subtitle: 'Arts. 679-695 CPC; Ley IV-N.15 art.118' }, { key: 'adopcion', title: 'Adopción', subtitle: 'Ley XII-20 / Art. 654 CPC; Ley IV-N.15 art.118' }, { key: 'cuidadoPersonal', title: 'Cuidado Personal / Régimen', subtitle: 'Arts. 648,715 CPC; Ley IV-N.15 art.118' }, { key: 'divorcio', title: 'Divorcio y Nulidad', subtitle: 'Arts. 641,648,715-716 CPC; Ley IV-N.15 art.118' }, { key: 'tutelaCuratela', title: 'Tutela y Curatela', subtitle: 'Arts. 713-714 CPC; Ley IV-N.15 arts.113,118' }, { key: 'homologacion', title: 'Homologación de Acuerdos', subtitle: 'Arts. 311,648 CPC; Ley IV-N.15 art.118' } ] },
        { nombreCategoria: "⚖️ PROCESOS DE VIOLENCIA FAMILIAR", id: "violencia_familiar", procesos: [ { key: 'proteccionViolencia', title: 'Violencia Familiar (Ley XIV-6)', subtitle: 'Arts. 655-658 CPC; Ley IV-N.15 arts.113,118' } ] },
        { nombreCategoria: "⚖️ PROCESOS CIVILES", id: "civil", procesos: [ { key: 'desalojo', title: 'Desalojo', subtitle: 'Arts. 623-635 CPC; Ley IV-N.15 arts.113,118' }, { key: 'interdictos', title: 'Interdictos Posesorios', subtitle: 'Arts. 576-592 CPC; Ley IV-N.15 art.118' }, { key: 'rendicionCuentas', title: 'Rendición de Cuentas', subtitle: 'Arts. 596-601 CPC; Ley IV-N.15 art.118' }, { key: 'divisionCondominio', title: 'División de Cosas Comunes', subtitle: 'Arts. 620-622 CPC; Ley IV-N.15 art.118' }, { key: 'mensuraDeslinde', title: 'Mensura y Deslinde', subtitle: 'Arts. 602-619 CPC; Ley IV-N.15 art.118' }, { key: 'ejecutivo', title: 'Juicio Ejecutivo', subtitle: 'Arts. 489-528 CPC; Ley IV-N.15 arts.113,118' }, { key: 'ejecucionHipotecaria', title: 'Ejecución Hipotecaria', subtitle: 'Arts. 567-569 CPC; Ley IV-N.15 art.118' }, { key: 'sucesorio', title: 'Proceso Sucesorio', subtitle: 'Arts. 717-763 CPC; Ley IV-N.15 arts.113,118' } ] },
        { nombreCategoria: "⚖️ CASOS ESPECIALES", id: "especial", procesos: [ { key: 'ausentes', title: 'Defensor de Ausentes', subtitle: 'Arts. 344,521,560,805 CPC; Ley IV-N.15 arts.113,114,118' }, { key: 'medidasAutosatisfactivas', title: 'Medidas Autosatisfactivas', subtitle: 'Arts. 636-639 CPC; Ley IV-N.15 art.118' } ] },
        { nombreCategoria: "⚖️ LEYES PROVINCIALES ESPECIALES", id: "leyes_especiales", procesos: [ { key: 'proteccionIntegridadSexual', title: 'Protección Víctimas Integridad Sexual (Ley XVII-37)', subtitle: 'Ley XVII-37; Ley IV-N.15 arts.113,118' }, { key: 'pensionGraciableMenores', title: 'Pensión Graciable a Menores Víctimas (Ley XIX-51)', subtitle: 'Ley XIX-51; Ley IV-N.15 arts.113,118' }, { key: 'proteccionPersonasMayores', title: 'Protección Integral Personas Mayores (Ley XIX-41)', subtitle: 'Ley XIX-41; Ley IV-N.15 arts.113,118' }, { key: 'mediacionHomologacion', title: 'Mediación y Homologación de Acuerdos (Ley XII-19)', subtitle: 'Ley XII-19 arts. 15,28,34,35,36; Ley IV-N.15 arts.113,118' } ] }
    ];

    let currentFilter = "";
    function renderAccordion(filterText = "") {
        const container = document.getElementById('accordion-container');
        if (!container) return;
        const filterLower = filterText.toLowerCase();
        const filteredMaterias = materias.map(materia => {
            const filteredProcesos = materia.procesos.filter(proc => proc.title.toLowerCase().includes(filterLower) || proc.subtitle.toLowerCase().includes(filterLower));
            return { ...materia, procesos: filteredProcesos };
        }).filter(materia => materia.procesos.length > 0);
        if (filteredMaterias.length === 0) {
            container.innerHTML = `<div class="p-6 text-center bg-white rounded-2xl text-slate-400">🔍 Ningún proceso coincide con "${filterText}"</div>`;
            return;
        }
        let html = '';
        filteredMaterias.forEach((materia, idx) => {
            const accordionId = `accordion-${materia.id}-${idx}`;
            const isOpen = false;
            html += `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="accordion-header flex justify-between items-center p-4 bg-slate-50 hover:bg-indigo-50 transition" data-target="${accordionId}">
                        <span class="font-extrabold text-indigo-800 text-sm tracking-wide">${materia.nombreCategoria}</span>
                        <i data-lucide="chevron-down" class="w-5 h-5 text-indigo-600 rotate-icon ${isOpen ? 'open' : ''} transition-transform"></i>
                    </div>
                    <div id="${accordionId}" class="accordion-content ${isOpen ? 'open' : ''} border-t border-slate-100">
                        <div class="p-3 space-y-2 bg-white">
                            ${materia.procesos.map(proc => `
                                <div class="proceso-card w-full text-left p-3 rounded-xl hover:bg-indigo-50 transition-all shadow-sm border border-slate-100" data-proceso='${JSON.stringify({ title: proc.title, subtitle: proc.subtitle, especial: proc.contenidoEspecial || false, key: proc.key })}'>
                                    <span class="block font-bold text-slate-800">${proc.title}</span>
                                    <div class="normativa-destacada mt-1 text-xs"><i data-lucide="book-open" class="w-3 h-3 inline mr-1"></i> ${proc.subtitle}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        if (window.lucide) lucide.createIcons();
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', (e) => {
                const targetId = header.getAttribute('data-target');
                const contentDiv = document.getElementById(targetId);
                const icon = header.querySelector('.rotate-icon');
                if (contentDiv) {
                    contentDiv.classList.toggle('open');
                    if (icon) icon.classList.toggle('open');
                }
            });
        });
        document.querySelectorAll('.proceso-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const data = JSON.parse(card.getAttribute('data-proceso'));
                mostrarContenidoCentral(data);
            });
        });
    }
    
    function mostrarContenidoCentral(procesoData) {
        const area = document.getElementById('detail-content-area');
        if (!area) return;
        if (procesoData.especial && procesoData.key === 'cejume') {
            area.innerHTML = buildCentralCejumeWithAccordions();
            if (window.lucide) lucide.createIcons();
            document.querySelectorAll('.inner-accordion-header').forEach(header => {
                const targetId = header.getAttribute('data-inner-target');
                const targetDiv = document.getElementById(targetId);
                const chevron = header.querySelector('.rotate-chevron');
                header.addEventListener('click', () => {
                    if (targetDiv) {
                        targetDiv.classList.toggle('open');
                        if (chevron) chevron.classList.toggle('open');
                    }
                });
            });
        } 
        else if (procesoData.key === 'alimentos') {
            area.innerHTML = buildAlimentosDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.key === 'proteccionViolencia') {
            area.innerHTML = buildViolenciaFamiliarDetailedContent();
            if (window.lucide) lucide.createIcons();
        }
        else if (procesoData.title) {
            area.innerHTML = placeholderContent(procesoData.title, procesoData.subtitle);
            if (window.lucide) lucide.createIcons();
        } else {
            area.innerHTML = emptyStateMessage;
            if (window.lucide) lucide.createIcons();
        }
    }
    
    function resetAndShowDefault() {
        currentFilter = "";
        const searchInput = document.getElementById('searchProceso');
        if (searchInput) searchInput.value = '';
        renderAccordion('');
        const area = document.getElementById('detail-content-area');
        if (area) {
            area.innerHTML = emptyStateMessage;
            if (window.lucide) lucide.createIcons();
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        resetAndShowDefault();
        const searchInput = document.getElementById('searchProceso');
        if (searchInput) searchInput.addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderAccordion(currentFilter);
        });
        const resetBtn = document.getElementById('resetAppButton');
        if (resetBtn) resetBtn.addEventListener('click', resetAndShowDefault);
        if (window.lucide) lucide.createIcons();
    });
</script>
</body>
</html>
